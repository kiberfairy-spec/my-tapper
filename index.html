<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Space Dream v2.30.5</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg: #000;
            --text: #e8f4ff;
            --text-dim: #8a9bb8;
            --accent: #00e8ff;
            --accent-2: #ff2bd6;
            --gold: #ffd400;
            --panel: rgba(4, 6, 22, 0.94);
            --panel-glass: rgba(6, 10, 32, 0.88);
            --neon-cyan: #00e8ff;
            --neon-magenta: #ff2bd6;
            --neon-glow-c: rgba(0, 232, 255, 0.55);
            --neon-glow-m: rgba(255, 43, 214, 0.45);
            --game-inset-top: env(safe-area-inset-top, 0px);
            --game-inset-bottom: env(safe-area-inset-bottom, 0px);
            --game-inset-left: env(safe-area-inset-left, 0px);
            --game-inset-right: env(safe-area-inset-right, 0px);
            --panel-top-h: 48px;
            --panel-bottom-h: 88px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Press Start 2P', monospace;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            position: fixed;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            padding: 0;
        }

        /* ── Звёзды ── */
        .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 40%, #0a1035 0%, #000 70%); }
        .star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle var(--d, 2s) infinite; animation-delay: var(--delay, 0s); }
        @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.8); } 50% { opacity: .9; transform: scale(1.2); } }
        @keyframes planetSlowSpin {
            from { transform: rotate(0deg) translateZ(0); }
            to { transform: rotate(360deg) translateZ(0); }
        }

        /* ── Верхняя панель ── */
        .top-panel {
            position: fixed;
            top: var(--game-inset-top);
            left: var(--game-inset-left);
            right: var(--game-inset-right);
            z-index: 100;
            background: transparent;
            padding: 0;
            overflow: visible;
            pointer-events: none;
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            font-weight: 300;
        }
        .top-panel-inner {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            padding: 3px 4px 0;
            pointer-events: none;
        }
        .top-hud {
            position: relative;
            display: flex;
            align-items: flex-end;
            gap: 5px;
            margin: -5px -6px 0;
            padding: 5px 6px 4px;
            min-height: 40px;
            pointer-events: auto;
            background: linear-gradient(180deg, rgba(8, 14, 42, 0.98) 0%, rgba(2, 4, 16, 0.96) 100%);
            border-bottom: 3px solid rgba(0, 232, 255, 0.55);
            box-shadow: 0 4px 20px rgba(0, 232, 255, 0.12), inset 0 -2px 0 rgba(255, 43, 214, 0.15);
            overflow: visible;
        }
        .top-hud-scanline {
            position: absolute;
            inset: 0;
            border-radius: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 232, 255, 0.012) 2px,
                rgba(0, 232, 255, 0.012) 3px
            );
            pointer-events: none;
        }

        /* Игрок — компактно слева */
        .top-player {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
            max-width: 40%;
            min-width: 0;
            padding-bottom: 1px;
            position: relative;
            z-index: 1;
        }
        .top-player .avatar {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1.5px solid var(--neon-cyan);
            box-shadow: 0 0 8px var(--neon-glow-c);
            background: #1a2040 center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            flex-shrink: 0;
            overflow: hidden;
            position: relative;
        }
        .top-player .avatar::before {
            content: '';
            position: absolute;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 4px;
            background: linear-gradient(180deg, #3a4558, var(--neon-cyan));
            border-radius: 1px;
        }
        .top-player .avatar.has-photo { color: transparent; }
        .player-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 2px;
            min-width: 0;
            line-height: 1;
        }
        .player-row-top {
            display: flex;
            align-items: baseline;
            gap: 3px;
            min-width: 0;
            max-width: 100%;
        }
        .top-player .pname {
            font-size: 9px;
            font-weight: 600;
            letter-spacing: 0.03em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #eef2fa;
            min-width: 0;
        }
        .top-player .plevel {
            font-size: 8px;
            color: #00e8ff;
            font-weight: 700;
            flex-shrink: 0;
            text-shadow: 0 0 8px rgba(0, 232, 255, 0.65), 0 0 14px rgba(0, 232, 255, 0.35);
            letter-spacing: 0.06em;
        }
        .player-vip {
            position: relative;
            display: inline-block;
            font-size: 7px;
            font-weight: 600;
            letter-spacing: 0.04em;
            color: #ffd400;
            white-space: nowrap;
            padding: 2px 5px;
            border: 2px solid #c9a020;
            border-radius: 3px;
            background: #2a2208;
            text-shadow: 0 0 6px rgba(255, 212, 0, 0.45);
            isolation: isolate;
        }
        .player-vip::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, #ffffff 0%, #ffd400 35%, transparent 68%);
            box-shadow: 0 0 4px #ffd400, 0 0 10px rgba(255, 212, 0, 0.95), 0 0 18px rgba(255, 212, 0, 0.45);
            opacity: 0;
            animation: vipSparkBorder 6s linear infinite;
            pointer-events: none;
            z-index: 2;
        }
        @keyframes vipSparkBorder {
            0%   { left: 0%;   top: 0%;   opacity: 0; }
            1%   { left: 0%;   top: 0%;   opacity: 1; }
            5.5% { left: 100%; top: 0%;   opacity: 1; }
            11%  { left: 100%; top: 100%; opacity: 1; }
            16.5%{ left: 0%;   top: 100%; opacity: 1; }
            22%  { left: 0%;   top: 0%;   opacity: 1; }
            23%  { opacity: 0; }
            100% { left: 0%;   top: 0%;   opacity: 0; }
        }

        /* Шина проводов — на всю ширину панели */
        .hud-wire-bus {
            position: absolute;
            top: 3px;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(180deg, #2a3448 0%, #1a2030 100%);
            border: 1px solid rgba(50, 65, 90, 0.7);
            border-radius: 2px;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06), 0 1px 3px rgba(0, 0, 0, 0.4);
            pointer-events: none;
            z-index: 0;
        }
        .hud-wire-bus::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            height: 1px;
            background: linear-gradient(90deg,
                rgba(0, 232, 255, 0.15),
                rgba(0, 232, 255, 0.35) 25%,
                rgba(255, 43, 214, 0.3) 50%,
                rgba(0, 232, 255, 0.35) 75%,
                rgba(0, 232, 255, 0.15));
            animation: busPulse 4s ease-in-out infinite;
        }
        @keyframes busPulse {
            0%, 100% { opacity: 0.45; }
            50% { opacity: 1; }
        }

        /* Ресурсы — шина проводов + индикаторы */
        .top-hud-resources {
            flex: 1;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            gap: 3px;
            min-width: 0;
            position: relative;
            padding-top: 9px;
            z-index: 1;
        }
        .res-node {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
            min-width: 0;
            max-width: 52px;
            z-index: 1;
        }
        .hud-wire {
            position: relative;
            width: 2px;
            height: 8px;
            flex-shrink: 0;
            background: linear-gradient(180deg, #3a4558 0%, var(--neon-color, #00e8ff) 100%);
            border-radius: 1px;
            box-shadow: 0 0 5px var(--neon-glow, rgba(0, 232, 255, 0.3));
            opacity: 0.9;
            transition: opacity 0.1s, filter 0.1s;
        }
        .hud-wire::before {
            content: '';
            position: absolute;
            top: -3px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: radial-gradient(circle at 40% 35%, var(--neon-color), #1a2030 70%);
            border: 1px solid rgba(80, 100, 130, 0.6);
            box-shadow: 0 0 6px var(--neon-glow, rgba(0, 232, 255, 0.4));
        }
        .hud-wire::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 2px;
            background: #2a3548;
            border-radius: 0 0 1px 1px;
        }
        .res-pill {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            padding: 2px 5px;
            border-radius: 4px;
            background: rgba(0, 6, 20, 0.75);
            border: 2px solid rgba(0, 232, 255, 0.35);
            min-width: 0;
            width: 100%;
            justify-content: center;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.4);
        }
        .res-pill-hero {
            border: 2px solid rgba(255, 92, 244, 0.55);
            background: rgba(40, 8, 40, 0.45);
            box-shadow: 0 0 8px rgba(255, 92, 244, 0.2);
        }
        .res-icon {
            font-size: 10px;
            line-height: 1;
            flex-shrink: 0;
        }
        .res-val {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 0.02em;
            color: var(--neon-color, #e8f4ff);
            text-shadow: 0 0 6px var(--neon-glow, var(--neon-glow-c));
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 42px;
        }
        .res-pill-hero .res-val { max-width: 48px; }
        .top-panel .resource-neon {
            --neon-color: #00e8ff;
            --neon-glow: rgba(0, 232, 255, 0.85);
        }
        .neon-cyan   { --neon-color: #00e8ff; --neon-glow: rgba(0, 232, 255, 0.85); }
        .neon-magenta{ --neon-color: #ff2bd6; --neon-glow: rgba(255, 43, 214, 0.85); }
        .neon-lime   { --neon-color: #b8ff00; --neon-glow: rgba(184, 255, 0, 0.85); }
        .neon-orange { --neon-color: #ff6a1a; --neon-glow: rgba(255, 106, 26, 0.85); }
        .neon-gold   { --neon-color: #ffd400; --neon-glow: rgba(255, 212, 0, 0.85); }
        .neon-pink   { --neon-color: #ff5cf4; --neon-glow: rgba(255, 92, 244, 0.85); }
        .neon-blue   { --neon-color: #4da6ff; --neon-glow: rgba(77, 166, 255, 0.85); }
        .neon-green  { --neon-color: #45ff9a; --neon-glow: rgba(69, 255, 154, 0.85); }

        @keyframes neonBurnout {
            0%, 100% { opacity: 1; filter: brightness(1); }
            4%  { opacity: 0.08; filter: brightness(0.04); }
            7%  { opacity: 1; filter: brightness(2.4); }
            10% { opacity: 0.06; filter: brightness(0.03); }
            13% { opacity: 0.9; filter: brightness(1.4); }
            16% { opacity: 1; filter: brightness(1); }
        }
        .top-panel .resource-neon.neon-flicker {
            animation: neonBurnout 1.1s linear forwards;
        }
        .res-node:has(.resource-neon.neon-flicker) .hud-wire {
            animation: wireBurnout 1.1s linear forwards;
        }
        @keyframes wireBurnout {
            0%, 100% { opacity: 0.9; filter: brightness(1); box-shadow: 0 0 5px var(--neon-glow); }
            4%  { opacity: 0.05; filter: brightness(0.1); box-shadow: none; }
            7%  { opacity: 1; filter: brightness(2.5); box-shadow: 0 0 12px var(--neon-glow); }
            10% { opacity: 0.04; filter: brightness(0.05); box-shadow: none; }
            13% { opacity: 0.85; filter: brightness(1.6); box-shadow: 0 0 8px var(--neon-glow); }
            16% { opacity: 0.9; filter: brightness(1); }
        }


        /* ── Единое игровое поле ── */
        .mining-screen {
            position: fixed;
            top: var(--game-inset-top);
            bottom: calc(var(--game-inset-bottom) + var(--panel-bottom-h));
            left: var(--game-inset-left);
            right: var(--game-inset-right);
            z-index: 1;
            display: none;
            overflow: hidden;
            background: transparent;
        }
        .mining-screen.active { display: block; }
        .mining-viewport {
            position: absolute;
            top: var(--panel-top-h);
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            overflow: hidden;
            touch-action: none;
            cursor: crosshair;
            background: transparent;
        }
        /* HUD-кнопки — зафиксированы на экране, часть игрового поля */
        .mining-hud {
            position: absolute;
            top: var(--panel-top-h);
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 4;
            pointer-events: none;
        }
        .mining-hud-actions {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 3px;
            pointer-events: auto;
        }
        .btn-action {
            --action-neon: #b80030;
            --action-glow: rgba(184, 0, 48, 0.85);
            -webkit-appearance: none;
            appearance: none;
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            font-size: 7px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #ffb0ba;
            cursor: pointer;
            width: 72px;
            height: 34px;
            padding: 1px 3px;
            line-height: 1.05;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--action-neon);
            border-radius: 5px;
            background-color: #180008;
            background-image:
                linear-gradient(180deg, rgba(255, 120, 140, 0.12) 0%, transparent 40%),
                linear-gradient(180deg, #5a001c 0%, #320010 52%, #180008 100%);
            box-shadow:
                0 3px 0 #220008,
                0 4px 12px rgba(0, 0, 0, 0.5),
                0 0 10px var(--action-glow),
                inset 0 1px 0 rgba(255, 140, 150, 0.25),
                inset 0 -2px 4px rgba(0, 0, 0, 0.45);
            text-shadow: 0 0 6px var(--action-glow);
            transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.08s ease;
        }
        .btn-action:active {
            transform: translateY(2px);
            filter: brightness(1.15);
            box-shadow:
                0 1px 0 #220008,
                0 2px 6px rgba(0, 0, 0, 0.45),
                0 0 14px var(--action-glow),
                inset 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        /* ── Нижняя навигация — консоль космического корабля ── */
        .bottom-nav {
            position: fixed;
            bottom: var(--game-inset-bottom);
            left: var(--game-inset-left);
            right: var(--game-inset-right);
            z-index: 100;
            padding: 0 5px 5px;
            background: transparent;
            border: none;
            box-shadow: none;
            pointer-events: none;
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
        }
        .cockpit-console {
            position: relative;
            pointer-events: auto;
            padding: 6px 8px 10px;
            background:
                linear-gradient(180deg, rgba(30, 42, 68, 0.98) 0%, rgba(12, 18, 32, 0.99) 45%, rgba(6, 10, 20, 1) 100%);
            border: 2px solid rgba(70, 90, 120, 0.65);
            border-top-color: rgba(120, 150, 190, 0.55);
            border-radius: 14px 14px 6px 6px;
            clip-path: polygon(5% 0, 95% 0, 100% 100%, 0 100%);
            box-shadow:
                0 -10px 36px rgba(0, 232, 255, 0.14),
                0 8px 24px rgba(0, 0, 0, 0.65),
                inset 0 2px 0 rgba(255, 255, 255, 0.1),
                inset 0 -6px 16px rgba(0, 0, 0, 0.55);
            overflow: hidden;
        }
        .cockpit-console::before {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                90deg,
                transparent,
                transparent 3px,
                rgba(0, 0, 0, 0.08) 3px,
                rgba(0, 0, 0, 0.08) 4px
            );
            pointer-events: none;
            opacity: 0.5;
        }
        .cockpit-console::after {
            content: '';
            position: absolute;
            top: 0;
            left: 8%;
            right: 8%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 232, 255, 0.6), rgba(255, 43, 214, 0.5), transparent);
            box-shadow: 0 0 10px rgba(0, 232, 255, 0.35);
            pointer-events: none;
        }
        .cockpit-console-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            padding: 0 4px;
            position: relative;
            z-index: 1;
        }
        .cockpit-rivet {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #8a9ab0, #2a3448 60%, #1a2030);
            box-shadow: inset 0 -1px 2px rgba(0, 0, 0, 0.6), 0 1px 0 rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
        }
        .cockpit-console-title {
            font-size: 7px;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(0, 232, 255, 0.75);
            text-shadow: 0 0 8px rgba(0, 232, 255, 0.4);
        }
        .cockpit-console-deck {
            display: flex;
            align-items: stretch;
            justify-content: space-between;
            gap: 4px;
            padding: 4px 2px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(50, 70, 100, 0.5);
            border-radius: 6px;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 1;
        }
        .cockpit-console-footer {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 5px;
            position: relative;
            z-index: 1;
        }
        .cockpit-led {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: #334455;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8);
        }
        .cockpit-led.on {
            background: #00e8ff;
            box-shadow: 0 0 6px rgba(0, 232, 255, 0.8), 0 0 12px rgba(0, 232, 255, 0.4);
        }
        .cockpit-led.warn {
            background: #ff6a1a;
            box-shadow: 0 0 6px rgba(255, 106, 26, 0.8);
            animation: ledBlink 2s ease-in-out infinite;
        }
        .cockpit-led.ok {
            background: #45ff9a;
            box-shadow: 0 0 6px rgba(69, 255, 154, 0.7);
        }
        @keyframes ledBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.35; }
        }
        .nav-btn {
            -webkit-appearance: none;
            appearance: none;
            flex: 1;
            margin: 0;
            max-width: 88px;
            padding: 12px 3px 7px;
            position: relative;
            background-color: #0a0e18;
            background-image:
                linear-gradient(180deg, rgba(255, 255, 255, 0.07) 0%, transparent 35%),
                linear-gradient(180deg, #1a2438 0%, #0e1424 55%, #060a12 100%);
            border: 1px solid rgba(60, 80, 110, 0.7);
            border-top-color: rgba(100, 130, 170, 0.5);
            border-bottom-color: rgba(20, 30, 50, 0.9);
            border-radius: 4px;
            color: #8aa0c0;
            font-family: inherit;
            font-size: 8px;
            font-weight: 600;
            letter-spacing: 0.03em;
            line-height: 1.25;
            cursor: pointer;
            text-align: center;
            box-shadow:
                0 4px 0 #030508,
                0 5px 12px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255, 255, 255, 0.12),
                inset 0 -2px 5px rgba(0, 0, 0, 0.4);
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.8);
            transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.08s ease, border-color 0.12s ease, color 0.12s ease;
            transform: translateY(0);
        }
        .nav-btn::before {
            content: '';
            position: absolute;
            top: 3px;
            left: 50%;
            transform: translateX(-50%);
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #2a3548;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.8);
        }
        .nav-btn:active:not(:disabled) {
            transform: translateY(3px);
            filter: brightness(1.1);
            box-shadow:
                0 1px 0 #030508,

        .input {

        .btn {
            width: 100%; padding: 9px; margin: 6px 0;

        .btn-back { border-color: rgba(120, 140, 180, 0.45); color: #9aa8c0; margin-top: 4px; box-shadow: none; }
        .btn-sm { width: auto; padding: 4px 8px; font-size: 8px; }
        .hidden { display: none !important; }
        .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

            background: radial-gradient(ellipse at 50% 50%, rgba(0, 40, 80, 0.35) 0%, transparent 72%);

function getFactionBaseStats(factionId = state.factionId) {
    const f = FACTIONS.find(x => x.id === factionId);
    if (!f) return { hp: FACTION_STAT_BASE, shield: FACTION_STAT_BASE, damage: FACTION_STAT_BASE, attackSpeed: FACTION_STAT_BASE };
    return { hp: f.hp, shield: f.shield, damage: f.damage, attackSpeed: f.attackSpeed };
}

function getCombatUpgradeLevels() {
    const u = state.upgrades;
    return {
        hp: u.hp || 0,
        damage: u.damage || 0,
        shield: u.shield || 0,
        speed: u.speed || 0,
    };
}

function canUpgradeCombatStat(key) {
    if (!COMBAT_UPGRADE_KEYS.includes(key)) return true;
    const lvls = getCombatUpgradeLevels();
    const next = lvls[key] + 1;
    const minOther = Math.min(...COMBAT_UPGRADE_KEYS.filter(k => k !== key).map(k => lvls[k]));
    return next <= minOther + UPGRADE_SPREAD_MAX;
}

function getCombatUpgradeBlockHint(key) {
    if (canUpgradeCombatStat(key)) return '';
    return `Поднимите отстающие статы — разрыв больше ${UPGRADE_SPREAD_MAX}`;
}

function getUpgradeSpreadHint() {
    const lvls = getCombatUpgradeLevels();
    const vals = COMBAT_UPGRADE_KEYS.map(k => lvls[k]);
    const spread = Math.max(...vals) - Math.min(...vals);
    if (spread <= 2) return { cls: 'ok', text: 'Прокачка сбалансирована' };
    if (spread < UPGRADE_SPREAD_MAX) return { cls: 'warn', text: `Разрыв уровней: ${spread} / ${UPGRADE_SPREAD_MAX}` };
    return { cls: 'warn', text: `Разрыв ${spread} — подтяните отстающие статы` };
}

function getShipCombatStats() {
    const base = getFactionBaseStats();
    const u = state.upgrades;
    const stats = {
        hp: base.hp + (u.hp || 0) * UPGRADE_STAT_BONUS,
        shield: base.shield + u.shield * UPGRADE_STAT_BONUS,
        damage: base.damage + u.damage * UPGRADE_STAT_BONUS,
        attackSpeed: base.attackSpeed + u.speed * UPGRADE_STAT_BONUS,
    };
    const art = ARTIFACTS.find(a => a.id === state.artifact.id);
    if (art && state.artifact.level > 0) {
        const key = art.effect === 'speed' ? 'attackSpeed' : art.effect;
        stats[key] += state.artifact.level * art.per;
    }
    return stats;
}

            <span class="ship-stat-val">${val}</span>
        </div>`;
    }).join('');
    return `<div class="ship-stats">${rows}</div>`;
}

// Палитры по референсам Gremak / Yoral / Phidi
const SHIP_PAL = {
    tank:   ['','#101820','#283038','#485058','#8898a8','#d8e0e8','#40d8ff','#4488aa','#ffffff'],
    dps:    ['','#181008','#302018','#504030','#786050','#a88868','#d8a830','#aa5533','#c8b898'],
    sniper: ['','#0a1018','#203028','#385848','#508870','#aa9933','#a048e0','#40e8c8','#f0ffe8'],
};
const SHIP_W = 40, SHIP_H = 56;
const SHIP_NORM_W = 49;
const SHIP_NORM_H = 54;
const SHIP_MINING_H = 56;
const SHIP_SELECT_H = 200;
const SHIP_EXTRA = { o:'#e87828', r:'#cc3038', g:'#40e8ff', y:'#d8b030', p:'#a048e0' };

function getFactionStripeColor(factionId) {
    switch (factionId) {
        case 'tank': return '#4488aa';   // голубые полоски
        case 'dps': return '#141010';    // чёрные полоски на оранжевом корпусе
        case 'sniper': return '#8B2942'; // бордовые полоски на жёлтом корпусе

    }
}

function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
}

function isConfederationStripe(r, g, b) {
    const spread = Math.max(r, g, b) - Math.min(r, g, b);
    if (spread < 28) return false;
    if (b > 130 && g > 90 && b >= r - 10) return false;
    if (g > 110 && b > 70 && Math.abs(g - b) < 35) return false;
    if (r > 95 && g > 40 && b < 100 && r > b + 25 && r > g + 15) return true;
    return false;
}

function isRebelStripe(r, g, b) {
    if (r < 60 && g < 60 && b < 60) return true;
    if (r > 120 && r < 235 && g > 95 && g < 210 && b > 55 && b < 170 && r > g && g > b && r - g < 55) return true;
    return false;
}

function isGuildStripe(r, g, b) {
    if (r > 165 && g > 130 && b < 95) return false;
    if (b > 140 && g > 100 && b >= g - 25) return false;
    if (g > 45 && g > r + 8 && g > b + 5) return true;
    if (r > 70 && r < 140 && g < 55 && b < 55 && r > g + 20) return true;
    return false;
}

function shouldRecolorStripe(r, g, b, factionId) {
    if (factionId === 'tank') return isConfederationStripe(r, g, b);
    if (factionId === 'dps') return isRebelStripe(r, g, b);
    if (factionId === 'sniper') return isGuildStripe(r, g, b);
    return isConfederationStripe(r, g, b);
}

function recolorAccentStripes(ctx, accentHex, factionId = 'tank') {
    const w = ctx.canvas.width;
    const h = ctx.canvas.height;
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    const ac = hexToRgb(accentHex);
    for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2], a = d[i + 3];
        if (a < 20 || !shouldRecolorStripe(r, g, b, factionId)) continue;
        const lum = (r * 0.299 + g * 0.587 + b * 0.114) / 255;
        const shade = 0.5 + lum * 0.7;
        d[i] = Math.min(255, Math.round(ac.r * shade));
        d[i + 1] = Math.min(255, Math.round(ac.g * shade));
        d[i + 2] = Math.min(255, Math.round(ac.b * shade));
    }
    ctx.putImageData(img, 0, 0);
}

function removeDarkBackground(ctx, threshold = 36) {
    const w = ctx.canvas.width;
    const h = ctx.canvas.height;
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        if (r <= threshold && g <= threshold && b <= threshold) d[i + 3] = 0;
    }
    ctx.putImageData(img, 0, 0);
}

function needsBackgroundKey(src) {
    return /\.jpe?g$/i.test(src);
}

function getSpriteContentBounds(ctx) {
    const w = ctx.canvas.width;
    const h = ctx.canvas.height;
    const d = ctx.getImageData(0, 0, w, h).data;
    let minX = w, minY = h, maxX = -1, maxY = -1;
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            if (d[(y * w + x) * 4 + 3] <= 20) continue;
            if (x < minX) minX = x;
            if (y < minY) minY = y;
            if (x > maxX) maxX = x;
            if (y > maxY) maxY = y;
        }
    }
    if (maxX < minX || maxY < minY) return { minX: 0, minY: 0, w, h };
    return { minX, minY, w: maxX - minX + 1, h: maxY - minY + 1 };
}

function normalizeShipCanvas(srcCanvas, outW = SHIP_NORM_W, outH = SHIP_NORM_H) {
    const srcCtx = srcCanvas.getContext('2d');
    const b = getSpriteContentBounds(srcCtx);
    const out = document.createElement('canvas');
    out.width = outW;
    out.height = outH;
    const ctx = out.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const pad = Math.max(1, Math.round(Math.min(outW, outH) * 0.04));
    const availW = outW - pad * 2;
    const availH = outH - pad * 2;
    const scale = Math.min(availW / b.w, availH / b.h);
    const dw = Math.max(1, Math.round(b.w * scale));
    const dh = Math.max(1, Math.round(b.h * scale));
    const dx = Math.floor((outW - dw) / 2);
    const dy = Math.floor((outH - dh) / 2);
    ctx.drawImage(srcCanvas, b.minX, b.minY, b.w, b.h, dx, dy, dw, dh);
    return out;
}

function buildFactionShipImage(src, factionId, sizeStyle, onReady) {
    const loader = new Image();
    loader.onload = () => {
        const tmp = document.createElement('canvas');
        tmp.width = loader.naturalWidth;
        tmp.height = loader.naturalHeight;
        const tctx = tmp.getContext('2d');
        tctx.imageSmoothingEnabled = false;
        tctx.drawImage(loader, 0, 0);
        if (needsBackgroundKey(src)) removeDarkBackground(tctx);
        recolorAccentStripes(tctx, getFactionStripeColor(factionId), factionId);

        const targetH = parseInt(sizeStyle.height || sizeStyle.maxHeight || String(SHIP_NORM_H), 10);
        const hiRes = loader.naturalWidth > 80 || loader.naturalHeight > 80;
        let outW = SHIP_NORM_W;
        let outH = SHIP_NORM_H;
        if (hiRes) {
            const b = getSpriteContentBounds(tctx);
            outH = targetH;
            outW = Math.max(1, Math.round(targetH * (b.w / b.h)));
        }

        const cvs = normalizeShipCanvas(tmp, outW, outH);
        cvs.className = 'ship-sprite-img';
        if (sizeStyle.height) cvs.style.height = sizeStyle.height;
        if (sizeStyle.maxHeight) cvs.style.maxHeight = sizeStyle.maxHeight;
        if (sizeStyle.width) cvs.style.width = sizeStyle.width;
        else cvs.style.width = 'auto';
        cvs.style.imageRendering = hiRes ? 'auto' : 'pixelated';
        onReady(cvs);
    };
    loader.src = src;
}

function drawPixelMatrix(ctx, px, matrix, palette) {
    const mh = matrix.length, mw = matrix[0].length;
    const ox = Math.floor((SHIP_W - mw) / 2), oy = Math.floor((SHIP_H - mh) / 2);
    for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) {
        const c = matrix[y][x];
        if (!c || !palette[c]) continue;
        ctx.fillStyle = palette[c];
        ctx.fillRect((ox + x) * px, (oy + y) * px, px, px);
    }
}

function drawMap(ctx, px, p, map) {
    const mh = map.length, mw = Math.max(...map.map(r => r.length));
    const ox = Math.floor((SHIP_W - mw) / 2), oy = Math.floor((SHIP_H - mh) / 2);
    for (let y = 0; y < mh; y++) for (let x = 0; x < map[y].length; x++) {
        const ch = map[y][x];
        if (ch === '.' || ch === ' ') continue;
        const col = (ch >= '1' && ch <= '8') ? p[+ch] : _shipDrawExtras[ch];
        if (!col) continue;
        ctx.fillStyle = col;
        ctx.fillRect((ox + x) * px, (oy + y) * px, px, px);
    }
}

function applyOutline(ctx, px) {
    const w = ctx.canvas.width, h = ctx.canvas.height;
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    const src = new Uint8ClampedArray(d);
    const solid = i => src[i + 3] > 30;
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            if (solid(i)) continue;
            let edge = false;
            for (let dy = -px; dy <= px && !edge; dy += px) {
                for (let dx = -px; dx <= px && !edge; dx += px) {
                    if (!dx && !dy) continue;
                    const nx = x + dx, ny = y + dy;
                    if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
                    if (solid((ny * w + nx) * 4)) edge = true;
                }
            }
            if (edge) { d[i] = 6; d[i + 1] = 6; d[i + 2] = 14; d[i + 3] = 255; }
        }
    }
    ctx.putImageData(img, 0, 0);
}

function renderShipCanvas(drawFn, factionId, pixelSize = 4) {

    return cvs;
}

const Storage = {
    cloud() {
        try { return window.Telegram?.WebApp?.CloudStorage || null; }
        catch (e) { return null; }
    },

    save() {
        const json = JSON.stringify(state);
        try { localStorage.setItem(SAVE_KEY, json); } catch (e) {}
        try {
            const cloud = this.cloud();
            if (cloud) cloud.setItem(SAVE_KEY, json, () => {});
        } catch (e) { /* CloudStorage недоступен в части WebView */ }
    },

    saveAsync() {
        return new Promise(resolve => {
            const json = JSON.stringify(state);
            try { localStorage.setItem(SAVE_KEY, json); } catch (e) {}
            try {
                const cloud = this.cloud();
                if (cloud) {
                    cloud.setItem(SAVE_KEY, json, () => resolve());
                    return;
                }
            } catch (e) {}
            resolve();
        });
    },

    loadLocal() {
        try {
            const raw = localStorage.getItem(SAVE_KEY);
            if (raw) return { ...defaultState(), ...JSON.parse(raw) };
        } catch (e) {}
        return defaultState();
    },

    loadCloud() {
        return new Promise(resolve => {
            let settled = false;
            const finish = val => {
                if (settled) return;
                settled = true;
                resolve(val);
            };
            setTimeout(() => finish(null), 2500);
            try {
                const cloud = this.cloud();
                if (!cloud) return finish(null);
                cloud.getItem(SAVE_KEY, (err, val) => {
                    if (err || !val) return finish(null);
                    try { finish({ ...defaultState(), ...JSON.parse(val) }); }
                    catch (e) { finish(null); }
                });
            } catch (e) {
                finish(null);
            }
        });
    },

    pickBestSave(local, cloud) {
        if (!cloud) return local;
        if (!local?.playerName && !local?.profileComplete) return cloud;
        if (!cloud.playerName && !cloud.profileComplete) return local;
        if (local.profileComplete && !cloud.profileComplete) return local;
        if (cloud.profileComplete && !local.profileComplete) return cloud;
        return cloud.playerName ? cloud : local;
    },

    async load() {
        const local = this.loadLocal();
        const cloud = await this.loadCloud();
        state = this.pickBestSave(local, cloud);
        state.upgrades = { ...defaultState().upgrades, ...(state.upgrades || {}) };
        if (state.factionId != null) {
            const list = SHIP_CATALOG[state.factionId] || SHIP_CATALOG.tank;
            if (state.shipIndex == null || state.shipIndex < 0) state.shipIndex = 0;
            if (state.shipIndex >= list.length) state.shipIndex = list.length - 1;
        }
        if (!state.profileComplete && state.playerName && state.factionId !== null && state.shipIndex !== null) {
            state.profileComplete = true;
        }
    },
};

function getMiningViewportMetrics() {
    const vp = $('mining-viewport');
    if (!vp) return { w: 360, h: 560, ox: 0, oy: 0 };
    const rect = vp.getBoundingClientRect();
    let w = rect.width;
    let h = rect.height;
    let ox = 0;
    let oy = 0;
    const vv = window.visualViewport;
    if (vv && w > 0 && h > 0) {
        const left = Math.max(rect.left, vv.offsetLeft);
        const top = Math.max(rect.top, vv.offsetTop);
        const right = Math.min(rect.left + w, vv.offsetLeft + vv.width);
        const bottom = Math.min(rect.top + h, vv.offsetTop + vv.height);
        w = Math.max(1, right - left);
        h = Math.max(1, bottom - top);
        ox = left - rect.left;
        oy = top - rect.top;
    }
    if (w < 1 || h < 1) {
        w = Math.max(1, vp.clientWidth || 360);
        h = Math.max(1, vp.clientHeight || 560);
        ox = 0;
        oy = 0;
    }
    return { w, h, ox, oy };
}

function lerpAngle(from, to, t) {
    let d = ((to - from + 180) % 360) - 180;
    return from + d * t;
}

function refreshWorldBounds() {
    const { w: vw, h: vh } = getMiningViewportMetrics();
    if (vw < 1 || vh < 1) return;
    const pad = Math.max(WORLD_PAD_MIN, Math.round(Math.max(vw, vh) * WORLD_PAD_RATIO)) - WORLD_PAD_TRIM;
    const width = Math.round(vw + pad * 2);
    const height = Math.round(vh + pad * 2);
    worldBounds = {
        width,
        height,
        centerX: width / 2,
        centerY: height / 2,
    };
    MAP_CENTER = { x: worldBounds.centerX, y: worldBounds.centerY };
}

function getViewportSize() {
    const { w, h } = getMiningViewportMetrics();
    return { w, h };
}

function clampCamera(cx, cy) {
    const { w: vw, h: vh } = getMiningViewportMetrics();
    const viewW = vw / mapZoom;
    const viewH = vh / mapZoom;
    return {
        x: Math.max(0, Math.min(Math.max(0, worldBounds.width - viewW), cx)),
        y: Math.max(0, Math.min(Math.max(0, worldBounds.height - viewH), cy)),
    };
}

function applyWorldTransform() {
    const world = $('mining-world');
    if (!world) return;
    // scale → translate: экран = (мир − камера) × zoom — корабль остаётся в центре
    world.style.transform = `scale(${mapZoom}) translate3d(${-Math.round(camera.x)}px, ${-Math.round(camera.y)}px, 0)`;
}

function updateCamera() {
    const { w: vw, h: vh } = getMiningViewportMetrics();
    const viewW = vw / mapZoom;
    const viewH = vh / mapZoom;
    const c = clampCamera(shipPos.x - viewW / 2, shipPos.y - viewH / 2);
    camera.x = c.x;
    camera.y = c.y;
    applyWorldTransform();
}

function getShipTailWorld(dist = 34) {
    // Нос вверху спрайта → корма смотрит на +90° от поворота корабля
    const rad = (shipRotation + 90) * Math.PI / 180;
    return {
        x: shipPos.x + Math.cos(rad) * dist,
        y: shipPos.y + Math.sin(rad) * dist,
    };
}

function drawShipFlame(cvs, frame) {
    const ctx = cvs.getContext('2d');
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    ctx.imageSmoothingEnabled = false;
    const wobble = frame % 3;
    const sway = (frame % 2 === 0) ? 0 : (frame % 4 === 1 ? 1 : -1);
    const cx = 2 + sway;
    const baseY = 1 + wobble;

    ctx.fillStyle = '#662200';
    ctx.fillRect(cx, baseY + 7 + wobble, 1, 1);
    ctx.fillStyle = '#994400';
    ctx.fillRect(cx, baseY + 6, 1, 1);
    ctx.fillStyle = '#ff4400';
    ctx.fillRect(cx, baseY + 2, 1, 4 + wobble);
    ctx.fillStyle = '#ff9900';
    ctx.fillRect(cx, baseY + 1, 1, 2);
    ctx.fillStyle = '#ffdd55';
    ctx.fillRect(cx, baseY + 2, 1, 1);
    if (sway !== 0) {
        ctx.fillStyle = '#ff6600';
        ctx.fillRect(cx - sway, baseY + 3, 1, 2);
    }
}

function updateShipVisual() {
    const el = $('player-ship');
    el.style.left = shipPos.x + 'px';
    el.style.top = shipPos.y + 'px';
    el.style.transform = `translate(-50%, -50%) rotate(${shipRotation}deg)`;

    const flying = !!shipTarget;
    el.classList.toggle('flying', flying);

    const flame = $('ship-flame');
    if (flame) {
        if (flying) {
            const tail = getShipTailWorld(34);
            flame.style.left = tail.x + 'px';
            flame.style.top = tail.y + 'px';
            flame.style.transform = `translate(-50%, -50%) rotate(${shipRotation}deg)`;
            flame.classList.add('active');
            shipFlameTick++;
            drawShipFlame(flame, shipFlameTick);

            flame.classList.remove('active');
            flame.getContext('2d').clearRect(0, 0, flame.width, flame.height);

function screenToWorld(sx, sy) {
    const rect = $('mining-viewport').getBoundingClientRect();
    return {
        x: (sx - rect.left) / mapZoom + camera.x,
        y: (sy - rect.top) / mapZoom + camera.y,
    };

function getShipNose(offset = 28) {
    const rad = (shipRotation - 90) * Math.PI / 180;
    return { x: shipPos.x + Math.cos(rad) * offset, y: shipPos.y + Math.sin(rad) * offset };
}

function approachPoint(tx, ty, stopDist) {
    const dx = tx - shipPos.x, dy = ty - shipPos.y;
    const dist = Math.hypot(dx, dy);
    if (dist <= stopDist) return { x: shipPos.x, y: shipPos.y };
    const k = (dist - stopDist) / dist;
    return { x: shipPos.x + dx * k, y: shipPos.y + dy * k };
}

function ensureShipFlightLoop() {
    if (shipAnimFrame) return;
    let last = performance.now();

    const tick = now => {
        if (!shipTarget) {
            shipAnimFrame = null;
            return;
        }

        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;

        const dx = shipTarget.x - shipPos.x;
        const dy = shipTarget.y - shipPos.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 3) {
            shipPos.x = shipTarget.x;
            shipPos.y = shipTarget.y;
            const onArrive = shipTarget.onArrive;
            shipTarget = null;
            updateShipVisual();
            if (onArrive) onArrive();
            shipAnimFrame = shipTarget ? requestAnimationFrame(tick) : null;
            return;
        }

        // Нос вверху спрайта → +90° к углу движения
        const targetRot = Math.atan2(dy, dx) * 180 / Math.PI + 90;
        shipRotation = lerpAngle(shipRotation, targetRot, SHIP_ROT_LERP);

        const step = SHIP_MOVE_SPEED * dt;
        const move = Math.min(step, dist);
        shipPos.x += (dx / dist) * move;
        shipPos.y += (dy / dist) * move;
        shipPos = clampWorld(shipPos.x, shipPos.y);
        updateShipVisual();

        shipAnimFrame = requestAnimationFrame(tick);
    };

    shipAnimFrame = requestAnimationFrame(tick);
}

function flyShipTo(x, y, onArrive) {
    const p = clampWorld(x, y);
    shipTarget = { x: p.x, y: p.y, onArrive };
    ensureShipFlightLoop();
}

function getPlanetDpr() {
    return Math.min(window.devicePixelRatio || 1, 2);
}

function sealCanvasOpaque(ctx, cx, cy, r) {
    const w = ctx.canvas.width;
    const h = ctx.canvas.height;
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    const r2 = r * r;
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            const dx = x - cx;
            const dy = y - cy;
            if (dx * dx + dy * dy > r2) {
                d[i + 3] = 0;
                continue;
            }
            if (d[i + 3] >= 255) continue;
            const a = d[i + 3] / 255;
            if (a < 0.04) {
                d[i + 3] = 0;
                continue;
            }
            d[i] = Math.min(255, Math.round(d[i] / a));
            d[i + 1] = Math.min(255, Math.round(d[i + 1] / a));
            d[i + 2] = Math.min(255, Math.round(d[i + 2] / a));
            d[i + 3] = 255;
        }
    }
    ctx.putImageData(img, 0, 0);
}

function stopPlanetSpin() {
    if (planetSpinRaf) cancelAnimationFrame(planetSpinRaf);
    planetSpinRaf = null;
}

function paintPlanetBase() {
    if (!planetRenderState) return;
    const st = planetRenderState;
    const { ctx, cx, cy, radius, size, img, imgW, imgH, dpr } = st;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.clip();
    const diam = radius * 2;
    const scale = Math.max(diam / imgW, diam / imgH);
    const drawW = imgW * scale;
    const drawH = imgH * scale;
    ctx.drawImage(img, cx - drawW / 2, cy - drawH / 2, drawW, drawH);
    ctx.restore();
    if (!st.sealed) {
        sealCanvasOpaque(ctx, cx * dpr, cy * dpr, radius * dpr);
        st.sealed = true;
    }
}

function paintPlanetSparks() {
    if (!planetRenderState) return;
    paintPlanetBase();
    if (planetActiveSparks.length && performance.now() < planetSparkUntil) {
        const { ctx, cx, cy, radius } = planetRenderState;
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, radius - 1, 0, Math.PI * 2);
        ctx.clip();
        for (const s of planetActiveSparks) drawSpiceSparkle(ctx, s.x, s.y, s.kind);
        ctx.restore();
    }
}

function paintPlanetSurface() {
    paintPlanetSparks();
    if (planetRenderState?.cvs) {
        planetRenderState.cvs.style.transform = `rotate(${planetSpinAngle}rad)`;
    }
}

function startPlanetSpin() {
    stopPlanetSpin();
    planetSpinLast = performance.now();
    const tick = (now) => {
        if (!planetRenderState) return;
        const dt = Math.min(0.05, (now - planetSpinLast) / 1000);
        planetSpinLast = now;
        const speed = shipTarget ? PLANET_SPIN_RAD_S * PLANET_SPIN_BOOST : PLANET_SPIN_RAD_S;
        planetSpinAngle += speed * dt;
        if (planetSpinAngle > Math.PI * 2) planetSpinAngle -= Math.PI * 2;
        if (planetRenderState.cvs) {
            planetRenderState.cvs.style.transform = `rotate(${planetSpinAngle}rad)`;
        }
        if (planetActiveSparks.length && performance.now() < planetSparkUntil) {
            paintPlanetSparks();
        }
        planetSpinRaf = requestAnimationFrame(tick);
    };
    planetSpinRaf = requestAnimationFrame(tick);
}

function drawSpiceSparkle(ctx, x, y, kind = Math.floor(Math.random() * 4)) {
    ctx.imageSmoothingEnabled = false;
    const ix = Math.floor(x);
    const iy = Math.floor(y);
    const core = SPICE_SPARK_CORE[Math.floor(Math.random() * SPICE_SPARK_CORE.length)];
    const halo = SPICE_SPARK_HALO[Math.floor(Math.random() * SPICE_SPARK_HALO.length)];

    if (kind === 0) {
        ctx.fillStyle = halo;
        ctx.fillRect(ix, iy, 1, 1);
        ctx.fillStyle = core;
        ctx.fillRect(ix, iy, 1, 1);
    } else if (kind === 1) {
        ctx.fillStyle = halo;
        ctx.fillRect(ix - 1, iy, 3, 1);
        ctx.fillRect(ix, iy - 1, 1, 3);
        ctx.fillStyle = core;
        ctx.fillRect(ix, iy, 1, 1);
        if (Math.random() > 0.4) ctx.fillRect(ix - 1, iy, 1, 1);
        if (Math.random() > 0.4) ctx.fillRect(ix + 1, iy, 1, 1);
    } else if (kind === 2) {
        ctx.fillStyle = halo;
        ctx.fillRect(ix, iy, 2, 2);
        ctx.fillStyle = core;
        ctx.fillRect(ix, iy, 1, 1);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(ix + 1, iy, 1, 1);
        ctx.fillRect(ix, iy + 1, 1, 1);
    } else {
        ctx.fillStyle = halo;
        ctx.fillRect(ix - 1, iy - 1, 1, 1);
        ctx.fillRect(ix + 1, iy + 1, 1, 1);
        ctx.fillStyle = core;
        ctx.fillRect(ix, iy, 1, 1);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(ix, iy, 1, 1);
        ctx.fillRect(ix - 1, iy + 1, 1, 1);
        ctx.fillRect(ix + 1, iy - 1, 1, 1);
    }
    ctx.imageSmoothingEnabled = true;
}

function makeSpiceSparkPoints(cx, cy, radius, count) {
    const pts = [];
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * (radius - 8) * 0.92;
        pts.push({
            x: cx + Math.cos(angle) * dist,
            y: cy + Math.sin(angle) * dist,
            kind: Math.floor(Math.random() * 4),
        });
    }
    return pts;
}

function triggerSpiceTwinkle(count) {
    if (!planetRenderState) return;
    const { cx, cy, radius } = planetRenderState;
    planetActiveSparks = makeSpiceSparkPoints(cx, cy, radius, count);
    planetSparkUntil = performance.now() + PLANET_SPARK_MS;
}

function startPlanetFlashes() {
    if (planetFlashTimer) clearInterval(planetFlashTimer);
    if (planetSparkTimer) clearInterval(planetSparkTimer);
    if (!planetRenderState) return;

    const twinkle = () => triggerSpiceTwinkle(8 + Math.floor(Math.random() * 12));

    twinkle();
    planetFlashTimer = setInterval(twinkle, PLANET_SPARK_INTERVAL);
    planetSparkTimer = setInterval(() => {
        if (Math.random() > 0.55) return;
        triggerSpiceTwinkle(1 + Math.floor(Math.random() * 2));
    }, 1100);
}

function drawPlanet() {
    const wrap = document.getElementById('planet-wrap');
    wrap.innerHTML = '';
    const img = new Image();
    img.src = SHIP_IMG.planet;

    const build = () => {
        const imgW = PLANET_DISPLAY_W;
        const imgH = Math.round(imgW * (img.naturalHeight / img.naturalWidth));
        const size = Math.max(imgW, imgH);
        const dpr = getPlanetDpr();
        const cx = size / 2;
        const cy = size / 2;
        const r = Math.min(imgW, imgH) / 2;

        wrap.style.width = size + 'px';
        wrap.style.height = size + 'px';

        const cvs = document.createElement('canvas');
        cvs.width = Math.round(size * dpr);
        cvs.height = Math.round(size * dpr);
        cvs.style.width = size + 'px';
        cvs.style.height = size + 'px';
        cvs.className = 'planet-canvas';
        const ctx = cvs.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        wrap.appendChild(cvs);

        planetRenderState = {
            ctx,
            cvs,
            cx,
            cy,
            radius: r,
            size,
            img,
            imgW,
            imgH,
            dpr,
            displayW: size,
            displayH: size,
            sealed: false,
        };
        planetSpinAngle = 0;
        cvs.style.transform = 'rotate(0rad)';
        paintPlanetSurface();
        startPlanetSpin();
        startPlanetFlashes();
    };

    if (img.complete && img.naturalWidth) build();
    else img.onload = build;
}

function renderPlayerShip() {
    const el = $('player-ship');
    el.innerHTML = '';

    const ship = getCurrentShip();
    const miningSrc = getShipMiningSrc(ship);
    if (miningSrc) {
        buildFactionShipImage(miningSrc, state.factionId, { height: SHIP_MINING_H + 'px' }, cvs => {
            el.appendChild(cvs);
            updateShipVisual();
        });
        return;
    }
    el.appendChild(renderShipGraphic(ship, state.factionId, 3));
    updateShipVisual();
}

function fillStars(container, count) {
    if (container.dataset.done) return;
    container.dataset.done = '1';
    for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${Math.random()*2+1}px;height:${Math.random()*2+1}px;--d:${1.5+Math.random()*3}s;--delay:${Math.random()*2}s`;
        container.appendChild(s);
    }
}

function flyToPlanetDock() {

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

        $('mining-screen').classList.add('active');

function buildMineObjectImage(src, kind, onReady) {
    const loader = new Image();
    loader.onload = () => {
        const tmp = document.createElement('canvas');
        tmp.width = loader.naturalWidth;
        tmp.height = loader.naturalHeight;
        const tctx = tmp.getContext('2d');
        tctx.imageSmoothingEnabled = false;
        tctx.drawImage(loader, 0, 0);
        if (needsBackgroundKey(src)) removeDarkBackground(tctx);
        const b = getSpriteContentBounds(tctx);
        const outH = getMineObjectHeight(kind);
        const outW = Math.max(1, Math.round(outH * (b.w / b.h)));
        const cvs = normalizeShipCanvas(tmp, outW, outH);
        cvs.className = 'mine-sprite-img';
        cvs.style.height = outH + 'px';
        cvs.style.width = 'auto';
        onReady(cvs);
    };
    loader.onerror = () => onReady(null);
    loader.src = src;
}

// ─── Добыча ──────────────────────────────────────────────────
function drawMeteorSprite(ctx, ps) {
    for (let y = 0; y < 14; y++) for (let x = 0; x < 14; x++) {
        const dx = x - 6.5, dy = y - 7;
        if (dx * dx + dy * dy > 30) continue;
        const c = ((x + y) % 5);
        ctx.fillStyle = ['#4a3020', '#6a4830', '#8a6850', '#5a3828', '#3a2018'][c];
        ctx.fillRect(x * ps, y * ps, ps, ps);
    }
    ctx.fillStyle = '#2a1810';
    ctx.fillRect(4 * ps, 5 * ps, 2 * ps, ps);
    ctx.fillRect(8 * ps, 8 * ps, 2 * ps, ps);
    ctx.fillRect(5 * ps, 9 * ps, ps, ps);
}

function drawWreckSprite(ctx, ps) {
    const plate = (x, y, w, h, col) => {
        ctx.fillStyle = col;
        ctx.fillRect(x * ps, y * ps, w * ps, h * ps);
    };
    plate(2, 6, 10, 2, '#3a4050');
    plate(4, 4, 6, 2, '#5a6070');
    plate(1, 8, 4, 2, '#aa5533');
    plate(9, 7, 3, 3, '#6a7078');
    plate(6, 9, 5, 1, '#404850');
    plate(3, 2, 2, 3, '#cc6633');
    plate(10, 3, 2, 2, '#888890');
    ctx.fillStyle = '#40e8ff';
    ctx.fillRect(5 * ps, 5 * ps, ps, ps);
}

function drawPirateSprite(ctx, ps) {
    const px = (x, y, c) => { ctx.fillStyle = c; ctx.fillRect(x * ps, y * ps, ps, ps); };
    const body = '#aa2222', dark = '#661010', wing = '#882828', cockpit = '#ffcc44';
    for (let y = 2; y < 14; y++) px(6, y, body);
    for (let x = 2; x < 11; x++) { px(x, 4, wing); px(x, 9, wing); }
    px(5, 1, dark); px(6, 1, dark); px(7, 1, dark);
    px(6, 3, cockpit);
    px(4, 6, dark); px(8, 6, dark);
    px(5, 12, dark); px(7, 12, dark);
    px(6, 13, '#ff4444');
}

function createMineCanvasSprite(kind) {
    const ps = kind === 'meteor' ? 6 : 2;
    const size = { meteor: [14, 14], wreck: [14, 12], pirate: [12, 14] }[kind];
    const cvs = document.createElement('canvas');
    cvs.width = size[0] * ps;
    cvs.height = size[1] * ps;
    const ctx = cvs.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    if (kind === 'meteor') drawMeteorSprite(ctx, ps);
    else if (kind === 'wreck') drawWreckSprite(ctx, ps);
    else drawPirateSprite(ctx, ps);
    return cvs;
}

function createMineSprite(kind) {
    const wrap = document.createElement('span');
    wrap.style.display = 'inline-flex';
    wrap.style.alignItems = 'center';
    wrap.style.justifyContent = 'center';
    wrap.style.lineHeight = '0';

    const src = pickMineImageSrc(kind);
    if (src) {
        buildMineObjectImage(src, kind, cvs => {
            wrap.textContent = '';
            wrap.appendChild(cvs || createMineCanvasSprite(kind));
        });
        return wrap;
    }

    wrap.appendChild(createMineCanvasSprite(kind));
    return wrap;
}
