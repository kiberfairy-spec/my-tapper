<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Space Dream v2.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg: #000;
            --text: #cc3333;
            --accent: #00aa44;
            --gold: #bb9922;
            --panel: rgba(2, 2, 14, 0.95);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Press Start 2P', monospace;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            position: fixed;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            padding-top: var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px));
            padding-bottom: var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
        }

        /* ── Звёзды ── */
        .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 40%, #0a1035 0%, #000 70%); }
        .star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle var(--d, 2s) infinite; animation-delay: var(--delay, 0s); }
        @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.8); } 50% { opacity: .9; transform: scale(1.2); } }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* ── Верхняя панель ── */
        .top-panel {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            background: rgba(0,0,0,.88); border-bottom: 1px solid var(--accent);
            padding: 4px 8px; display: flex; flex-direction: column; gap: 2px;
        }
        .top-row, .top-row2 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .top-row2 { justify-content: space-between; border-top: 1px solid var(--accent); padding-top: 3px; }
        .avatar { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--accent); background: #222; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        .pname { font-size: 7px; line-height: 1.6; }
        .plevel { font-size: 5px; color: #888; }
        .badge { background: rgba(0,0,0,.85); border: 2px solid var(--accent); padding: 2px 4px; font-size: 5px; white-space: nowrap; }
        .badge-gold { border-color: #ffcc00; color: #ffcc00; }
        .badge-blue { border-color: #4488ff; color: #4488ff; }
        .badge-pink { border-color: #ff66ff; color: #f5f5f5; }
        .badge-green { border-color: #66ff99; color: #66ff99; }
        .btn-xs { background: rgba(0,0,0,.8); border: 1px solid #8a2be2; color: #ff66aa; font-family: inherit; font-size: 4px; padding: 2px 4px; cursor: pointer; }
        .btn-reset { background: #aa3333; color: #fff; border: none; font-family: inherit; font-size: 4px; padding: 2px 5px; cursor: pointer; }

        /* ── Нижняя навигация ── */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
            height: 72px; background: rgba(2,2,10,.96); border-top: 1px solid var(--accent);
            display: flex; align-items: center; justify-content: space-around; padding: 4px;
        }
        .nav-btn {
            flex: 1; margin: 0 2px; max-width: 88px; padding: 6px 4px;
            background: #040c04; border: 1px solid var(--accent); color: var(--text);
            font-family: inherit; font-size: 5px; cursor: pointer; text-align: center;
        }
        .nav-btn.active { background: #061806; border-color: var(--gold); }

        /* ── Экран добычи ── */
        .mining-screen {
            position: fixed; top: 72px; left: 0; right: 0; bottom: 72px;
            z-index: 1; display: none; overflow: hidden;
        }
        .mining-screen.active { display: block; }
        .mining-stars { position: absolute; inset: 0; pointer-events: none; }
        .mining-field {
            position: relative; width: 100%; height: 100%;
            touch-action: none;
        }
        .mining-tap { position: absolute; inset: 0; z-index: 5; }
        .mining-hub {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: min(88vw, 380px); aspect-ratio: 1;
            pointer-events: none; z-index: 3;
        }
        .planet-glow {
            position: absolute; inset: 5%; border-radius: 50%;
            background: radial-gradient(circle, rgba(180,80,255,.35) 0%, transparent 70%);
        }
        .planet-wrap {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 90%; animation: spin 60s linear infinite;
        }
        .planet-canvas { width: 100%; image-rendering: pixelated; display: block; filter: drop-shadow(0 0 16px rgba(200,100,255,.5)); }
        .player-ship {
            position: absolute; z-index: 10; pointer-events: none;
            transform: translate(-50%, -50%);
        }
        .mine-object {
            position: absolute; z-index: 8; transform: translate(-50%, -50%);
            font-size: 26px; cursor: pointer; transition: opacity .3s;
        }

        /* ── Окна ── */
        .overlay {
            position: fixed; top: 72px; left: 0; right: 0; bottom: 72px;
            z-index: 50; display: none; align-items: center; justify-content: center;
            pointer-events: none;
        }
        .overlay.active { display: flex; }
        .overlay > .window { pointer-events: all; }
        .window {
            background: var(--panel); border: 1px solid var(--accent);
            padding: 12px; width: 90%; max-width: 340px; max-height: 65vh;
            overflow-y: auto; animation: slideUp .3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .wtitle { color: var(--gold); font-size: 7px; text-align: center; margin-bottom: 8px; }
        .input { width: 100%; padding: 6px; margin: 6px 0; background: #040410; border: 2px solid var(--accent); color: var(--text); font-family: inherit; font-size: 6px; text-align: center; }
        .btn { width: 100%; padding: 7px; margin: 5px 0; background: #040c04; border: 2px solid var(--accent); color: var(--text); font-family: inherit; font-size: 6px; cursor: pointer; }
        .btn:disabled { opacity: .4; cursor: not-allowed; }
        .btn-sm { width: auto; padding: 3px 6px; font-size: 4px; }
        .hidden { display: none !important; }
        .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
        .card { border: 2px solid var(--accent); padding: 6px; text-align: center; cursor: pointer; font-size: 5px; min-width: 80px; }
        .card.selected { border-color: #ffaa00; }
        .upgrade-row { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--accent); padding: 4px; margin: 3px 0; font-size: 5px; }
        .loot-feed { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 200; pointer-events: none; display: flex; gap: 6px; flex-wrap: wrap; }
        .loot { font-size: 5px; color: #ffcc00; background: rgba(0,0,0,.8); padding: 3px 6px; animation: fadeLoot 2.5s forwards; }
        @keyframes fadeLoot { 0% { opacity:0; transform:translateY(8px); } 15%,80% { opacity:1; transform:translateY(0); } 100% { opacity:0; transform:translateY(-8px); } }

        /* PvP */
        .pvp-grid { display: flex; align-items: center; gap: 4px; }
        .pvp-side { flex: 1; text-align: center; font-size: 5px; }
        .bar { height: 8px; background: #333; border: 1px solid var(--accent); margin: 3px 0; overflow: hidden; }
        .bar-fill { height: 100%; transition: width .2s; }
        .bar-shield { background: #4488ff; }
        .bar-hp { background: var(--accent); }
    </style>
</head>
<body>

<div class="stars" id="stars-global"></div>

<!-- Верхняя панель -->
<div class="top-panel hidden" id="top-panel">
    <div class="top-row">
        <div class="avatar" id="avatar">?</div>
        <div class="pname"><div id="ui-name">Игрок</div><div class="plevel" id="ui-level">Lvl 1</div></div>
        <div class="badge badge-gold" id="ui-vip">⭐ VIP 0</div>
        <div style="margin-left:auto;display:flex;gap:4px;flex-wrap:wrap">
            <div class="badge badge-pink">💎 <span id="ui-spice">0</span></div>
            <div class="badge badge-blue">⛽ <span id="ui-fuel">100</span></div>
            <div class="badge badge-gold">🪙 <span id="ui-credits">0</span></div>
            <div class="badge badge-green">🧩 <span id="ui-shards">0</span></div>
        </div>
    </div>
    <div class="top-row2">
        <button class="btn-reset" id="btn-reset">🔄 СБРОС</button>
        <div style="display:flex;gap:4px">
            <button class="btn-xs" data-open="battlepass">🎫 БАТЛ-ПАСС</button>
            <button class="btn-xs" data-open="boosts">⚡ УСИЛЕНИЯ</button>
            <button class="btn-xs" data-open="checkin">📅 ЧЕКИН</button>
        </div>
    </div>
</div>

<!-- Экран добычи -->
<div class="mining-screen" id="mining-screen">
    <div class="mining-stars" id="mining-stars"></div>
    <div class="mining-field" id="mining-field">
        <div class="mining-tap" id="mining-tap"></div>
        <div class="mining-hub">
            <div class="planet-glow"></div>
            <div class="planet-wrap" id="planet-wrap"></div>
        </div>
        <div class="player-ship" id="player-ship"></div>
    </div>
</div>

<div class="loot-feed" id="loot-feed"></div>

<!-- Окна -->
<div class="overlay active" id="overlay">
    <div class="window" id="win-start">
        <div class="wtitle">SPACE DREAM</div>
        <input class="input" id="inp-name" placeholder="ИМЯ ИГРОКА" maxlength="12">
        <button class="btn" id="btn-start">ДАЛЕЕ</button>
    </div>
    <div class="window hidden" id="win-faction">
        <div class="wtitle">ВЫБЕРИ ФРАКЦИЮ</div>
        <div id="faction-list"></div>
    </div>
    <div class="window hidden" id="win-ship">
        <div class="wtitle">ВЫБЕРИ КОРАБЛЬ</div>
        <div class="row" id="ship-list"></div>
        <button class="btn" id="btn-ship-confirm" disabled>ПОДТВЕРДИТЬ</button>
    </div>
    <div class="window hidden" id="win-hangar">
        <div class="wtitle">АНГАР</div>
        <div id="hangar-ship" style="text-align:center;margin:8px 0"></div>
        <div id="hangar-res" style="font-size:5px;text-align:center;margin-bottom:8px"></div>
        <div id="upgrade-list"></div>
        <div class="wtitle" style="margin-top:10px;font-size:6px">АРТЕФАКТЫ</div>
        <div class="row" id="artifact-list"></div>
    </div>
    <div class="window hidden" id="win-pvp">
        <div class="wtitle">КОСМОБИТВА</div>
        <div class="pvp-grid">
            <div class="pvp-side"><div id="pvp-my-ship"></div><div id="pvp-my-bars"></div></div>
            <div style="font-size:12px;color:#aa3333">VS</div>
            <div class="pvp-side"><div id="pvp-en-ship"></div><div id="pvp-en-bars"></div></div>
        </div>
        <div style="text-align:center;font-size:6px;margin:6px 0" id="pvp-status">Нажмите НАЙТИ БОЙ</div>
        <button class="btn" id="btn-pvp">НАЙТИ БОЙ</button>
        <div id="leaderboard" style="font-size:4px;margin-top:8px;max-height:80px;overflow-y:auto"></div>
    </div>
    <div class="window hidden" id="win-minigames">
        <div class="wtitle">МИНИ-ИГРЫ</div>
        <p style="font-size:6px;text-align:center">🚧 В разработке</p>
    </div>
    <div class="window hidden" id="win-checkin">
        <div class="wtitle">ЕЖЕДНЕВНЫЙ ЧЕКИН</div>
        <div id="checkin-grid"></div>
        <button class="btn" id="btn-checkin">ЗАБРАТЬ</button>
    </div>
    <div class="window hidden" id="win-battlepass">
        <div class="wtitle">БАТЛ-ПАСС</div>
        <div id="bp-grid"></div>
        <button class="btn" id="btn-bp-buy">КУПИТЬ (10 USDT)</button>
        <button class="btn" id="btn-bp-claim">ЗАБРАТЬ</button>
    </div>
    <div class="window hidden" id="win-boosts">
        <div class="wtitle">УСИЛЕНИЯ</div>
        <div id="boost-list"></div>
        <button class="btn" id="btn-boost-buy">КУПИТЬ</button>
    </div>
</div>

<!-- Нижняя навигация -->
<div class="bottom-nav hidden" id="bottom-nav">
    <button class="nav-btn active" data-tab="mining">🌌 ДОБЫЧА</button>
    <button class="nav-btn" data-tab="hangar">🚀 АНГАР</button>
    <button class="nav-btn" data-tab="pvp">⚔️ PvP</button>
    <button class="nav-btn" data-tab="minigames">🎮 МИНИ-ИГРЫ</button>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   SPACE DREAM v2 — чистая архитектура
   ═══════════════════════════════════════════════════════════ */

// ─── Константы ───────────────────────────────────────────────
const VERSION = '2.0';
const SAVE_KEY = 'space_dream_save';
const SHIP_SPEED = 100;
const FUEL_PER_FLIGHT = 10;

const FACTIONS = [
    { id: 'tank',   name: 'Конфедерация',    color: '#4488aa', shield: 40, damage: 20, speed: 15 },
    { id: 'dps',    name: 'Повстанцы',       color: '#aa5533', shield: 15, damage: 25, speed: 35 },
    { id: 'sniper', name: 'Торговая гильдия', color: '#aa9933', shield: 20, damage: 40, speed: 15 },
];

const PALETTE = { A:'#2E0A4E',B:'#5B2C8E',C:'#8B5FBF',P:'#FF44AA',Q:'#44CCFF',R:'#8B0000',D:'#2A2A2A',E:'#FF4500',F:'#FF6600',G:'#FFAA00',H:'#FFD700','_':null };

const SHIP_MATRIX = [
    "__________A___________","_________AAA__________","_________AAA__________",
    "________AAAAA_________","________AACAA_________","________ACCCA_________",
    "________ACCCA_________","________AAAAA_________","________APBBA_________",
    "________ABBBB_________","________ABBBB_________","_______AABABAA_______",
    "_______ABBABB_______","_______ABBCBA_______","_______ABBCBA_______",
    "_____AAABBABBAAA_____","____ABBABBBBBABB____","___ABBBABBBBBABBBA___",
    "__ABBBBABBBBBABBBB__","_ABBBBBAPBBBPABBBBB_","ABBBBBBAAAAAAABBBBBBA",
    "ABQQBBBABBBBBABBBQQBA","AAAAAAAAABBBBBAAAAAAAAA","_______AAAAAAA_______",
    "________AAAAA_________","_______AAA_AAA_______","_______AAA_AAA_______",
    "________QQ_QQ_________","________QQ_QQ_________","________QB_QB_________",
    "_________Q__Q________","_________Q__Q________"
];

const ARTIFACTS = [
    { id:'blade',  name:'Клинок Фантома',       effect:'damage', per:5 },
    { id:'shield', name:'Щит Нерушимости',      effect:'shield', per:5 },
    { id:'engine', name:'Двигатель Вихря',      effect:'speed',  per:5 },
];

const UPGRADES = [
    { key:'damage',   label:'УРОН',           max:30 },
    { key:'shield',   label:'ЗАЩИТА',         max:30 },
    { key:'speed',    label:'СКОРОСТЬ',       max:30 },
    { key:'luck',     label:'УДАЧА',          max:5  },
    { key:'fuelTank', label:'ТОПЛИВНЫЙ БАК',  max:10 },
];

// ─── Состояние ───────────────────────────────────────────────
const defaultState = () => ({
    version: VERSION,
    playerName: '',
    factionId: null,
    shipIndex: 0,
    profileComplete: false,
    level: 1, exp: 0, vip: 0, pvpScore: 0,
    resources: { credits:0, fuel:100, spice:0, shards:0, shieldParts:0, weaponParts:0, speedParts:0 },
    maxFuel: 100,
    upgrades: { damage:0, shield:0, speed:0, luck:0, fuelTank:0 },
    artifact: { id:null, level:0 },
    checkin: { day:1, lastClaim:null, claimedToday:false },
    bp: { paid:false, day:1, lastClaim:null, claimedToday:false },
    boosts: [],
    leaderboard: [],
    freeRefuelUsed: false,
});

let state = defaultState();
let currentTab = 'mining';
let shipPos = { x: 0, y: 0 };
let shipMoving = false;
let shipFlying = false;
let mineObjects = [];
let selectedBoost = null;

// ─── Хранилище ───────────────────────────────────────────────
const Storage = {
    save() {
        const json = JSON.stringify(state);
        try { localStorage.setItem(SAVE_KEY, json); } catch(e) {}
        const cloud = window.Telegram?.WebApp?.CloudStorage;
        if (cloud) cloud.setItem(SAVE_KEY, json, () => {});
    },

    loadLocal() {
        try {
            const raw = localStorage.getItem(SAVE_KEY);
            if (raw) return { ...defaultState(), ...JSON.parse(raw) };
        } catch(e) {}
        return defaultState();
    },

    loadCloud() {
        return new Promise(resolve => {
            const cloud = window.Telegram?.WebApp?.CloudStorage;
            if (!cloud) return resolve(null);
            cloud.getItem(SAVE_KEY, (err, val) => {
                if (err || !val) return resolve(null);
                try { resolve({ ...defaultState(), ...JSON.parse(val) }); }
                catch(e) { resolve(null); }
            });
        });
    },

    async load() {
        const cloud = await this.loadCloud();
        state = cloud || this.loadLocal();
        if (!state.profileComplete && state.playerName && state.factionId !== null) {
            state.profileComplete = true;
        }
    },

    reset() {
        try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
        const cloud = window.Telegram?.WebApp?.CloudStorage;
        if (cloud) cloud.removeItem(SAVE_KEY, () => location.reload());
        else location.reload();
    }
};

// ─── Telegram ───────────────────────────────────────────────
function initTelegram() {
    const tg = window.Telegram?.WebApp;
    if (!tg) return;
    tg.ready();
    tg.expand();
    if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
    if (tg.setHeaderColor) tg.setHeaderColor('#000000');
    if (tg.setBackgroundColor) tg.setBackgroundColor('#000000');
}

// ─── Графика ─────────────────────────────────────────────────
function drawMatrix(matrix, scale = 1) {
    if (!matrix?.length) {
        const s = document.createElement('span');
        s.textContent = '🚀'; s.style.fontSize = '24px';
        return s;
    }
    const rows = matrix.length, cols = matrix[0].length;
    const ts = Math.max(2, Math.round(4 * scale));
    const cvs = document.createElement('canvas');
    cvs.width = cols * ts; cvs.height = rows * ts;
    const ctx = cvs.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    for (let y = 0; y < rows; y++) {
        for (let x = 0; x < cols; x++) {
            const ch = matrix[y][x];
            if (ch === '_' || !PALETTE[ch]) continue;
            ctx.fillStyle = PALETTE[ch];
            ctx.fillRect(x * ts, y * ts, ts, ts);
        }
    }
    cvs.style.imageRendering = 'pixelated';
    return cvs;
}

function drawPlanet() {
    const wrap = document.getElementById('planet-wrap');
    wrap.innerHTML = '';
    const W = 72, H = 44, ps = 3;
    const cvs = document.createElement('canvas');
    cvs.width = W * ps; cvs.height = H * ps;
    cvs.className = 'planet-canvas';
    const ctx = cvs.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const colors = { 2:'#b094fa', 3:'#f25cf2', 4:'#ff9eff' };
    const cx = 36, cy = 22, r = 18;
    for (let y = 0; y < H; y++) {
        for (let x = 0; x < W; x++) {
            if ((x-cx)**2 + (y-cy)**2 <= r*r) {
                ctx.fillStyle = colors[((y+x)%3===0)?3:2] || '#b094fa';
                ctx.fillRect(x*ps, y*ps, ps, ps);
            }
        }
    }
    wrap.appendChild(cvs);
}

function renderPlayerShip(rotation = -20) {
    const el = document.getElementById('player-ship');
    el.innerHTML = '';
    el.appendChild(drawMatrix(SHIP_MATRIX, 0.55));
    el.style.transform = `translate(-50%,-50%) rotate(${rotation}deg)`;
}

function fillStars(container, count) {
    if (container.dataset.done) return;
    container.dataset.done = '1';
    for (let i = 0; i < count; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${Math.random()*2+1}px;height:${Math.random()*2+1}px;--d:${1.5+Math.random()*3}s;--delay:${Math.random()*2}s`;
        container.appendChild(s);
    }
}

// ─── UI ──────────────────────────────────────────────────────
function $(id) { return document.getElementById(id); }

function showWindow(name) {
    document.querySelectorAll('.window').forEach(w => w.classList.add('hidden'));
    $('win-' + name)?.classList.remove('hidden');
    $('overlay').classList.add('active');
}

function hideOverlay() {
    $('overlay').classList.remove('active');
}

function showGameUI() {
    $('top-panel').classList.remove('hidden');
    $('bottom-nav').classList.remove('hidden');
}

function updateHUD() {
    const r = state.resources;
    $('ui-name').textContent = state.playerName || 'Игрок';
    $('ui-level').textContent = `Lvl ${state.level}`;
    $('ui-vip').textContent = `⭐ VIP ${state.vip}`;
    $('ui-spice').textContent = r.spice;
    $('ui-fuel').textContent = `${Math.floor(r.fuel)}/${state.maxFuel}`;
    $('ui-credits').textContent = Math.floor(r.credits);
    $('ui-shards').textContent = r.shards;
    $('avatar').textContent = state.playerName ? state.playerName[0].toUpperCase() : '?';
}

function showLoot(text) {
    const el = document.createElement('span');
    el.className = 'loot'; el.textContent = text;
    $('loot-feed').appendChild(el);
    setTimeout(() => el.remove(), 2500);
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

    if (tab === 'mining') {
        $('mining-screen').classList.add('active');
        hideOverlay();
        layoutMining();
        renderPlayerShip();
        generateMineObjects();
    } else {
        $('mining-screen').classList.remove('active');
        $('overlay').classList.add('active');
        if (tab === 'hangar') { showWindow('hangar'); renderHangar(); }
        if (tab === 'pvp')     { showWindow('pvp'); renderPvP(); }
        if (tab === 'minigames') showWindow('minigames');
    }
}

// ─── Добыча ──────────────────────────────────────────────────
function getFieldRect() {
    return $('mining-field').getBoundingClientRect();
}

function getPlanetCenter() {
    const field = $('mining-field');
    return { x: field.offsetWidth / 2, y: field.offsetHeight / 2 };
}

function getShipHome() {
    const c = getPlanetCenter();
    return { x: c.x + 90, y: c.y + 20 };
}

function setShipPos(x, y, rot = -20) {
    shipPos = { x, y };
    const el = $('player-ship');
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    el.style.transform = `translate(-50%,-50%) rotate(${rot}deg)`;
}

function moveShip(tx, ty) {
    if (shipMoving || shipFlying) return;
    const field = $('mining-field');
    const margin = 20;
    tx = Math.max(margin, Math.min(field.offsetWidth - margin, tx));
    ty = Math.max(margin, Math.min(field.offsetHeight - margin, ty));
    const dx = tx - shipPos.x, dy = ty - shipPos.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 10) return;

    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    const ms = Math.max(300, dist / SHIP_SPEED * 1000);
    shipMoving = true;
    const el = $('player-ship');
    el.style.transition = `left ${ms}ms linear, top ${ms}ms linear, transform ${ms}ms linear`;
    setShipPos(tx, ty, angle);
    setTimeout(() => { shipMoving = false; el.style.transition = ''; }, ms);
}

function layoutMining() {
    fillStars($('mining-stars'), 200);
    if (!shipPos.x && !shipPos.y) setShipPos(...Object.values(getShipHome()));
    else setShipPos(shipPos.x, shipPos.y);
}

function generateMineObjects() {
    $('mining-field').querySelectorAll('.mine-object').forEach(e => e.remove());
    mineObjects = [];
    const center = getPlanetCenter();
    const types = ['🪨','🪨','👾','👾','🛸'];
    types.forEach(type => {
        const angle = Math.random() * Math.PI * 2;
        const dist = 100 + Math.random() * 80;
        const x = center.x + Math.cos(angle) * dist;
        const y = center.y + Math.sin(angle) * dist;
        const el = document.createElement('div');
        el.className = 'mine-object';
        el.textContent = type;
        el.style.left = x + 'px'; el.style.top = y + 'px';
        el.onclick = (e) => { e.stopPropagation(); flyToMine({ x, y, el, type }); };
        $('mining-field').appendChild(el);
        mineObjects.push({ x, y, el, type });
    });
}

function rollLoot() {
    const r = Math.random() * 100;
    if (r < 50) return null;
    const pool = [
        () => { const n = 10+Math.floor(Math.random()*40); state.resources.credits+=n; return `+${n} 🪙`; },
        () => { const n = 3+Math.floor(Math.random()*8); state.resources.fuel=Math.min(state.maxFuel,state.resources.fuel+n); return `+${n} ⛽`; },
        () => { const n = 1+Math.floor(Math.random()*3); state.resources.spice+=n; return `+${n} 💎`; },
        () => { state.resources.weaponParts++; return '+1 ⚔️'; },
    ];
    return pool[Math.floor(Math.random()*pool.length)]();
}

function flyToMine(obj) {
    if (shipFlying || shipMoving || state.resources.fuel < FUEL_PER_FLIGHT) return;
    shipFlying = true;
    state.resources.fuel -= FUEL_PER_FLIGHT;
    Storage.save(); updateHUD();

    const start = { ...shipPos };
    const el = $('player-ship');
    const dx = obj.x - start.x, dy = obj.y - start.y;
    const angle = Math.atan2(dy, dx) * 180 / Math.PI;
    const ms = Math.hypot(dx, dy) / SHIP_SPEED * 1000 + 400;

    el.style.transition = `left ${ms}ms linear, top ${ms}ms linear, transform ${ms}ms linear`;
    setShipPos(obj.x, obj.y, angle);

    setTimeout(() => {
        const loot = rollLoot();
        if (loot) showLoot(loot);
        state.exp += 10;
        if (state.exp >= state.level * 100) { state.exp -= state.level * 100; state.level++; showLoot(`Уровень ${state.level}!`); }
        obj.el.style.opacity = '0';
        setTimeout(() => obj.el.remove(), 300);
        mineObjects = mineObjects.filter(o => o !== obj);

        el.style.transition = `left ${ms}ms linear, top ${ms}ms linear`;
        setShipPos(start.x, start.y, -20);

        setTimeout(() => {
            shipFlying = false;
            el.style.transition = '';
            if (!mineObjects.length) generateMineObjects();
            Storage.save(); updateHUD();
        }, ms);
    }, ms);
}

function initMiningTap() {
    const tap = $('mining-tap');
    if (tap.dataset.ready) return;
    tap.dataset.ready = '1';
    let lastTouch = 0;

    const onTap = (cx, cy) => {
        if (!state.profileComplete || shipFlying) return;
        const rect = getFieldRect();
        moveShip(cx - rect.left, cy - rect.top);
    };

    tap.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
    tap.addEventListener('touchend', e => {
        e.preventDefault();
        const t = e.changedTouches[0];
        if (!t) return;
        lastTouch = Date.now();
        onTap(t.clientX, t.clientY);
    }, { passive: false });
    tap.addEventListener('click', e => {
        if (Date.now() - lastTouch < 400) return;
        onTap(e.clientX, e.clientY);
    });
}

// ─── Ангар ───────────────────────────────────────────────────
function upgradeCost(key) {
    const lvl = state.upgrades[key];
    if (key === 'fuelTank') return { credits: 100 * 2**lvl, parts: 0 };
    return { credits: 50 * 2**lvl, parts: Math.ceil(5 * 1.5**lvl) };
}

function renderHangar() {
    const r = state.resources;
    $('hangar-ship').innerHTML = '';
    $('hangar-ship').appendChild(drawMatrix(SHIP_MATRIX, 0.9));
    $('hangar-res').textContent = `🪙${Math.floor(r.credits)} ⛽${Math.floor(r.fuel)}/${state.maxFuel} 🛡️${r.shieldParts} ⚔️${r.weaponParts} 💎${r.spice} 🧩${r.shards}`;

    $('upgrade-list').innerHTML = UPGRADES.map(u => {
        const lvl = state.upgrades[u.key];
        const cost = upgradeCost(u.key);
        const can = lvl < u.max && r.credits >= cost.credits;
        return `<div class="upgrade-row"><span>${u.label} ${lvl}/${u.max}</span><button class="btn btn-sm" ${can?'':'disabled'} data-upg="${u.key}">${cost.credits}🪙</button></div>`;
    }).join('');

    $('upgrade-list').querySelectorAll('[data-upg]').forEach(btn => {
        btn.onclick = () => {
            const key = btn.dataset.upg;
            const u = UPGRADES.find(x => x.key === key);
            const cost = upgradeCost(key);
            if (state.upgrades[key] >= u.max || state.resources.credits < cost.credits) return;
            state.resources.credits -= cost.credits;
            state.upgrades[key]++;
            if (key === 'fuelTank') { state.maxFuel += 10; state.resources.fuel = Math.min(state.maxFuel, state.resources.fuel + 10); }
            Storage.save(); updateHUD(); renderHangar();
        };
    });

    $('artifact-list').innerHTML = ARTIFACTS.map(a => {
        const eq = state.artifact.id === a.id;
        return `<div class="card ${eq?'selected':''}" data-art="${a.id}"><div>${a.name}</div><div style="font-size:3px;margin-top:3px">${eq?'ур.'+state.artifact.level:'нет'}</div></div>`;
    }).join('');
}

// ─── PvP (упрощённый) ───────────────────────────────────────
function renderPvP() {
    $('pvp-my-ship').innerHTML = ''; $('pvp-en-ship').innerHTML = '';
    $('pvp-my-ship').appendChild(drawMatrix(SHIP_MATRIX, 0.5));
    const en = document.createElement('span'); en.textContent = '👾'; en.style.fontSize='22px';
    $('pvp-en-ship').appendChild(en);
    $('pvp-my-bars').innerHTML = '<div class="bar"><div class="bar-fill bar-shield" style="width:100%"></div></div><div class="bar"><div class="bar-fill bar-hp" style="width:100%"></div></div>';
    $('pvp-en-bars').innerHTML = '<div class="bar"><div class="bar-fill bar-shield" style="width:100%"></div></div><div class="bar"><div class="bar-fill bar-hp" style="width:100%"></div></div>';
    $('leaderboard').innerHTML = '<div style="color:var(--gold)">ТОП 10</div>' +
        state.leaderboard.slice(0,10).map((p,i)=>`<div>#${i+1} ${p.name}: ${p.score}</div>`).join('');
}

function startPvP() {
    const result = Math.random() > 0.45 ? 'win' : 'lose';
    if (result === 'win') { state.pvpScore += 15; $('pvp-status').textContent = 'ПОБЕДА! +15'; showLoot('+15 PvP'); }
    else { state.pvpScore = Math.max(0, state.pvpScore - 10); $('pvp-status').textContent = 'ПОРАЖЕНИЕ... -10'; }
    const idx = state.leaderboard.findIndex(p => p.name === state.playerName);
    if (idx >= 0) state.leaderboard[idx].score = state.pvpScore;
    else state.leaderboard.push({ name: state.playerName, score: state.pvpScore });
    state.leaderboard.sort((a,b) => b.score - a.score);
    Storage.save(); renderPvP();
}

// ─── Онбординг ───────────────────────────────────────────────
function renderFactions() {
    $('faction-list').innerHTML = FACTIONS.map(f =>
        `<button class="btn" style="border-color:${f.color};color:${f.color}" data-fid="${f.id}">
            ◆ ${f.name}<br><small style="font-size:4px">Щ:${f.shield} У:${f.damage} С:${f.speed}</small>
        </button>`
    ).join('');
    $('faction-list').querySelectorAll('[data-fid]').forEach(btn => {
        btn.onclick = () => { state.factionId = btn.dataset.fid; Storage.save(); renderShips(); showWindow('ship'); };
    });
}

function renderShips() {
    $('ship-list').innerHTML = [0,1,2].map(i =>
        `<div class="card ${state.shipIndex===i?'selected':''}" data-ship="${i}"></div>`
    ).join('');
    $('ship-list').querySelectorAll('[data-ship]').forEach(card => {
        card.appendChild(drawMatrix(SHIP_MATRIX, 0.5 + +card.dataset.ship * 0.1));
        card.onclick = () => {
            state.shipIndex = +card.dataset.ship;
            Storage.save();
            $('ship-list').querySelectorAll('.card').forEach(c => c.classList.toggle('selected', +c.dataset.ship === state.shipIndex));
            $('btn-ship-confirm').disabled = false;
        };
    });
}

function completeProfile() {
    state.profileComplete = true;
    Storage.save();
    showGameUI();
    switchTab('mining');
}

function resumeOrStart() {
    if (state.profileComplete) {
        showGameUI();
        switchTab('mining');
        updateHUD();
        return;
    }
    if (state.playerName && state.factionId !== null) {
        renderShips();
        showWindow('ship');
        return;
    }
    if (state.playerName) {
        renderFactions();
        showWindow('faction');
        return;
    }
    showWindow('start');
}

// ─── Инициализация ───────────────────────────────────────────
function bindEvents() {
    $('btn-start').onclick = () => {
        const name = $('inp-name').value.trim();
        if (name.length < 2) return alert('Минимум 2 символа');
        state.playerName = name;
        Storage.save();
        renderFactions();
        showWindow('faction');
    };

    $('btn-ship-confirm').onclick = completeProfile;

    $('btn-reset').onclick = () => {
        if (confirm('Сбросить весь прогресс?')) Storage.reset();
    };

    document.querySelectorAll('[data-tab]').forEach(btn => {
        btn.onclick = () => switchTab(btn.dataset.tab);
    });

    document.querySelectorAll('[data-open]').forEach(btn => {
        btn.onclick = () => showWindow(btn.dataset.open);
    });

    $('btn-pvp').onclick = startPvP;
    $('btn-checkin').onclick = () => {
        if (state.checkin.claimedToday) return alert('Уже забрали сегодня');
        state.resources.credits += 20; state.resources.fuel = Math.min(state.maxFuel, state.resources.fuel + 5);
        state.checkin.claimedToday = true; state.checkin.day = Math.min(7, state.checkin.day + 1);
        Storage.save(); updateHUD(); showLoot('+20 🪙 +5 ⛽');
    };

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') Storage.save();
    });
    window.addEventListener('pagehide', () => Storage.save());
}

async function boot() {
    initTelegram();
    fillStars($('stars-global'), 300);
    drawPlanet();
    initMiningTap();
    bindEvents();
    await Storage.load();
    resumeOrStart();
    updateHUD();

    // Восстановление топлива
    setInterval(() => {
        if (state.resources.fuel < state.maxFuel) {
            state.resources.fuel = Math.min(state.maxFuel, state.resources.fuel + 1);
            updateHUD();
            Storage.save();
        }
    }, 4 * 60 * 1000);
}

document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
