function getShipOrbit() {
    return { x: MAP_CENTER.x, y: MAP_CENTER.y + ORBIT_DIST, rot: 0 };
}

function resetShipToOrbit() {
    refreshWorldBounds();
    const o = getShipOrbit();
    shipPos = clampWorld(o.x, o.y);
    shipRotation = o.rot;
    shipTarget = null;
    updateShipVisual();
}

function getShipHome() {
    return getShipOrbit();
}

function getMineStopDist(kind) {
    if (kind === 'meteor') return MINE_STOP_DIST_METEOR;
    if (kind === 'pirate') return MINE_STOP_DIST_PIRATE;
    return MINE_STOP_DIST_WRECK;
}

function pickPiratePatrolPoint() {
    const cx = MAP_CENTER.x;
    const cy = MAP_CENTER.y;
    const margin = 40;
    const minDist = PLANET_HUB_R + 90;
    const maxDist = Math.min(worldBounds.width, worldBounds.height) / 2 - 55;
    for (let i = 0; i < 60; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = minDist + Math.random() * Math.max(40, maxDist - minDist);
        let x = cx + Math.cos(angle) * dist;
        let y = cy + Math.sin(angle) * dist;
        x = Math.max(margin, Math.min(worldBounds.width - margin, x));
        y = Math.max(margin, Math.min(worldBounds.height - margin, y));
        if (Math.hypot(x - cx, y - cy) >= minDist) return { x, y };
    }
    return clampWorld(cx + minDist, cy, margin);
}

function updatePirateVisual(obj) {
    obj.el.style.left = obj.x + 'px';
    obj.el.style.top = obj.y + 'px';
    obj.el.style.transform = `translate(-50%, -50%) rotate(${obj.rotation || 0}deg)`;
}

function initPiratePatrol(obj) {
    obj.rotation = Math.random() * 360;
    obj.patrolTarget = pickPiratePatrolPoint();
    obj.patrolPaused = false;
    updatePirateVisual(obj);
}

function stopPiratePatrol() {
    if (piratePatrolFrame) cancelAnimationFrame(piratePatrolFrame);
    piratePatrolFrame = null;
}

function ensurePiratePatrolLoop() {
    if (piratePatrolFrame || currentTab !== 'mining') return;
    let last = performance.now();

    const tick = now => {
        const pirates = mineObjects.filter(o => o.kind === 'pirate' && !o.patrolPaused);
        if (!pirates.length || currentTab !== 'mining') {
            stopPiratePatrol();
            return;
        }

        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;

        for (const obj of pirates) {
            if (!obj.patrolTarget) obj.patrolTarget = pickPiratePatrolPoint();

            const dx = obj.patrolTarget.x - obj.x;
            const dy = obj.patrolTarget.y - obj.y;
            const dist = Math.hypot(dx, dy);

            if (dist < 4) {
                obj.patrolTarget = pickPiratePatrolPoint();
                continue;
            }

            obj.rotation = lerpAngle(obj.rotation || 0, Math.atan2(dy, dx) * 180 / Math.PI + 90, SHIP_ROT_LERP);
            const move = Math.min(PIRATE_PATROL_SPEED * dt, dist);
            obj.x += (dx / dist) * move;
            obj.y += (dy / dist) * move;
            const clamped = clampWorld(obj.x, obj.y, 40);
            obj.x = clamped.x;
            obj.y = clamped.y;
            updatePirateVisual(obj);
        }

        piratePatrolFrame = requestAnimationFrame(tick);
    };

    piratePatrolFrame = requestAnimationFrame(tick);
}

function clampWorld(x, y, margin = 28) {
    return {
        x: Math.max(margin, Math.min(worldBounds.width - margin, x)),
        y: Math.max(margin, Math.min(worldBounds.height - margin, y)),
    };
}

function setShipPos(x, y, rot = shipRotation) {
    shipPos = clampWorld(x, y);
    shipRotation = rot;
    updateShipVisual();
}

function moveShip(wx, wy) {
    if (shipFlying) return;
    const p = clampWorld(wx, wy);
    flyShipTo(p.x, p.y);
}

function layoutMining() {
    initMiningWorld();
    resetShipToOrbit();
    if (!mineObjects.length) generateMineObjects();
    ensurePiratePatrolLoop();
    if (planetRenderState) startPlanetSpin();
}

function onMiningResize() {
    if (currentTab !== 'mining') return;
    syncPanelHeights();
    applyGameInsets();
    const prevCenter = { x: MAP_CENTER.x, y: MAP_CENTER.y };
    refreshWorldBounds();
    const world = $('mining-world');
    if (world) {
        world.style.width = worldBounds.width + 'px';
        world.style.height = worldBounds.height + 'px';
        $('mining-hub').style.left = MAP_CENTER.x + 'px';
        $('mining-hub').style.top = MAP_CENTER.y + 'px';
        const laser = $('laser-layer');
        if (laser) {
            laser.setAttribute('width', worldBounds.width);
            laser.setAttribute('height', worldBounds.height);
            laser.setAttribute('viewBox', `0 0 ${worldBounds.width} ${worldBounds.height}`);
            world.appendChild(laser);
        }
    }
    if (Math.abs(prevCenter.x - MAP_CENTER.x) > 1 || Math.abs(prevCenter.y - MAP_CENTER.y) > 1) {
        generateMineObjects();
    }
    resetShipToOrbit();
}

function shuffleArr(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function bindMineObject(obj) {
    const el = obj.el;
    let touchHandled = false;

    el.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });

    el.addEventListener('touchend', e => {
        e.stopPropagation();
        e.preventDefault();
        touchHandled = true;
        setTimeout(() => { touchHandled = false; }, 450);
        if (!state.profileComplete || shipFlying) return;
        flyToMine(obj);
    }, { passive: false });

    el.addEventListener('click', e => {
        e.stopPropagation();
        if (touchHandled) return;
        if (!state.profileComplete || shipFlying) return;
        flyToMine(obj);
    });
}

function buildMineKinds() {
    // 9 объектов: по 3 каждого типа, порядок случайный
    return shuffleArr([
        ...Array(3).fill('meteor'),
        ...Array(3).fill('wreck'),
        ...Array(3).fill('pirate'),
    ]);
}

function generateMineObjects() {
    const world = $('mining-world');
    if (!world) return;
    world.querySelectorAll('.mine-object').forEach(e => e.remove());
    mineObjects = [];
    refreshWorldBounds();

    const kinds = buildMineKinds();
    const placed = [];
    const cx = MAP_CENTER.x, cy = MAP_CENTER.y;
    const PLANET_R = PLANET_HUB_R;
    const MIN_FROM_PLANET = PLANET_R + 90;
    const MAX_FROM_PLANET = Math.min(worldBounds.width, worldBounds.height) / 2 - 55;
    const MIN_FROM_OBJ = 75;
    const margin = 40;

    kinds.forEach(kind => {
        let x, y, ok = false;
        for (let attempt = 0; attempt < 500 && !ok; attempt++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = MIN_FROM_PLANET + Math.random() * (MAX_FROM_PLANET - MIN_FROM_PLANET);
            x = cx + Math.cos(angle) * dist;
            y = cy + Math.sin(angle) * dist;
            x = Math.max(margin, Math.min(worldBounds.width - margin, x));
            y = Math.max(margin, Math.min(worldBounds.height - margin, y));
            if (Math.hypot(x - cx, y - cy) < MIN_FROM_PLANET) continue;
            if (placed.some(p => Math.hypot(x - p.x, y - p.y) < MIN_FROM_OBJ)) continue;
            ok = true;
        }
        if (!ok) {
            const angle = (placed.length / kinds.length) * Math.PI * 2 + Math.random() * 0.5;
            const dist = MIN_FROM_PLANET + Math.random() * (MAX_FROM_PLANET - MIN_FROM_PLANET) * 0.7;
            x = cx + Math.cos(angle) * dist;
            y = cy + Math.sin(angle) * dist;
            const p = clampWorld(x, y, margin);
            x = p.x;
            y = p.y;
        }
        placed.push({ x, y });

        const el = document.createElement('div');
        el.className = 'mine-object mine-' + kind;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        if (kind === 'meteor' || kind === 'wreck') {
            el.style.animationDuration = (3.2 + Math.random() * 2.4).toFixed(2) + 's';
            el.style.animationDelay = (-Math.random() * 5).toFixed(2) + 's';
        }
        el.appendChild(createMineSprite(kind));

        const objRef = { x, y, kind, el };
        mineObjects.push(objRef);
        if (kind === 'pirate') initPiratePatrol(objRef);
        bindMineObject(objRef);
        world.insertBefore(el, $('player-ship'));
    });

    ensurePiratePatrolLoop();

    // Эффекты поверх объектов
    const laser = $('laser-layer');
    if (laser) world.appendChild(laser);
}

function rollLootForKind(kind) {
    const r = state.resources;
    if (kind === 'meteor') {
        const credits = 15 + Math.floor(Math.random() * 35);
        const shards = 1 + Math.floor(Math.random() * 2);
        r.credits += credits;
        r.shards += shards;
        return `Метеорит: +${credits} 🪙 +${shards} 🧩`;
    }
    if (kind === 'wreck') {
        const fuel = 4 + Math.floor(Math.random() * 8);
        r.fuel = Math.min(state.maxFuel, r.fuel + fuel);
        r.weaponParts++;
        return `Обломки: +${fuel} ⛽ +1 ⚔️`;
    }
    const spice = 1 + Math.floor(Math.random() * 3);
    const credits = 20 + Math.floor(Math.random() * 30);
    r.spice += spice;
    r.credits += credits;
    return `Пират: +${spice} 💎 +${credits} 🪙`;
}

function getPirateNose(obj, offset = 22) {
    const rad = ((obj.rotation || 0) - 90) * Math.PI / 180;
    return {
        x: obj.x + Math.cos(rad) * offset,
        y: obj.y + Math.sin(rad) * offset,
    };
}

function appendLaserBeam(layer, x1, y1, x2, y2, color = 'blue') {
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('class', color === 'red' ? 'laser-beam laser-red' : 'laser-beam laser-blue');
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);
    layer.appendChild(line);
}

function fireLasersAt(obj, onDone, color = 'blue') {
    const layer = $('laser-layer');
    layer.innerHTML = '';
    const nose = getShipNose();
    const offsets = [-4, 0, 4];
    const rad = (shipRotation - 90) * Math.PI / 180;

    offsets.forEach(off => {
        const px = nose.x + Math.cos(rad + Math.PI / 2) * off;
        const py = nose.y + Math.sin(rad + Math.PI / 2) * off;
        appendLaserBeam(layer, px, py, obj.x, obj.y, color);
    });

    setTimeout(() => {
        layer.innerHTML = '';
        onDone();
    }, MINE_LASER_MS);
}

function firePirateDuel(obj, onDone) {
    const layer = $('laser-layer');
    layer.innerHTML = '';
    const playerNose = getShipNose();
    const pirateNose = getPirateNose(obj);
    const playerRad = (shipRotation - 90) * Math.PI / 180;
    const pirateRad = ((obj.rotation || 0) - 90) * Math.PI / 180;
    const offsets = [-4, 0, 4];

    offsets.forEach(off => {
        const px = playerNose.x + Math.cos(playerRad + Math.PI / 2) * off;
        const py = playerNose.y + Math.sin(playerRad + Math.PI / 2) * off;
        appendLaserBeam(layer, px, py, obj.x, obj.y, 'red');
    });

    offsets.forEach(off => {
        const px = pirateNose.x + Math.cos(pirateRad + Math.PI / 2) * off;
        const py = pirateNose.y + Math.sin(pirateRad + Math.PI / 2) * off;
        appendLaserBeam(layer, px, py, shipPos.x, shipPos.y, 'red');
    });

    setTimeout(() => {
        layer.innerHTML = '';
        onDone();
    }, MINE_LASER_MS);
}

function fireSoundWavesAt(obj, onDone) {
    const layer = $('laser-layer');
    layer.innerHTML = '';
    const nose = getShipNose();
    const dx = obj.x - nose.x, dy = obj.y - nose.y;
    const dist = Math.max(1, Math.hypot(dx, dy));
    const nx = dx / dist, ny = dy / dist;
    const px = -ny, py = nx;

    for (let i = 0; i < 5; i++) {
        const t = 0.12 + (i + 1) * 0.14;
        const mx = nose.x + dx * t;
        const my = nose.y + dy * t;
        const bulge = 10 + i * 7;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const x1 = mx - px * bulge, y1 = my - py * bulge;
        const x2 = mx + px * bulge, y2 = my + py * bulge;
        const cx = mx + nx * 8, cy = my + ny * 8;
        path.setAttribute('d', `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`);
        path.setAttribute('class', 'sound-wave');
        path.style.animationDelay = `${i * 0.18}s`;
        layer.appendChild(path);
    }

    setTimeout(() => {
        layer.innerHTML = '';
        onDone();
    }, MINE_LASER_MS);
}

function fireMineEffect(obj, onDone) {
    if (obj.kind === 'meteor') fireSoundWavesAt(obj, onDone);
    else if (obj.kind === 'wreck') fireLasersAt(obj, onDone, 'blue');
    else firePirateDuel(obj, onDone);
}

function flyToMine(obj) {
    if (shipFlying || returningToPlanet) return;
    if (!mineObjects.includes(obj)) return;
    if (obj.kind === 'pirate') obj.patrolPaused = true;
    if (!DEV_FREE_FUEL && state.resources.fuel < FUEL_PER_FLIGHT) {
        flyToPlanetDock();
        return;
    }

    shipFlying = true;
    if (!DEV_FREE_FUEL) {
        state.resources.fuel -= FUEL_PER_FLIGHT;
        Storage.save();
        updateHUD();
    }

    const lootX = obj.x, lootY = obj.y;
    const target = approachPoint(obj.x, obj.y, getMineStopDist(obj.kind));
    flyShipTo(target.x, target.y, () => {
        fireMineEffect(obj, () => {
            const loot = rollLootForKind(obj.kind);
            showMineLoot(loot, lootX, lootY);
            state.exp += 12;
            if (state.exp >= state.level * 100) {
                state.exp -= state.level * 100;
                state.level++;
                showMineLoot(`Уровень ${state.level}!`, lootX, lootY - 18);
            }
            obj.el.style.opacity = '0';
            mineObjects = mineObjects.filter(o => o !== obj);
            setTimeout(() => {
                obj.el.remove();
                shipFlying = false;
                if (mineObjects.length === 0) generateMineObjects();
                Storage.save();
                updateHUD();
                checkFuelAndReturn();
            }, 300);
        });
    });
}

function initMiningTap() {
    const vp = $('mining-viewport');
    if (vp.dataset.ready) return;
    vp.dataset.ready = '1';
    let lastTouch = 0;
    let touchStart = null;
    let pinchState = null;
    let pinchUsed = false;

    const touchDistance = touches => {
        if (touches.length < 2) return 0;
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.hypot(dx, dy);
    };

    const onMoveTap = (cx, cy) => {
        if (!state.profileComplete || shipFlying) return;
        const w = screenToWorld(cx, cy);
        moveShip(w.x, w.y);
    };

    vp.addEventListener('touchstart', e => {
        if (e.target.closest('.mine-object')) return;
        if (e.touches.length === 2) {
            pinchState = {
                dist: touchDistance(e.touches),
                zoom: mapZoom,
            };
            touchStart = null;
            e.preventDefault();
            return;
        }
        if (e.touches.length !== 1) return;
        const t = e.touches[0];
        touchStart = { x: t.clientX, y: t.clientY, time: Date.now() };
    }, { passive: false });

    vp.addEventListener('touchmove', e => {
        if (!pinchState || e.touches.length < 2) return;
        e.preventDefault();
        const dist = touchDistance(e.touches);
        if (dist < 6 || pinchState.dist < 6) return;
        mapZoom = Math.max(MAP_ZOOM_MIN, Math.min(MAP_ZOOM_MAX, pinchState.zoom * (dist / pinchState.dist)));
        updateCamera();
        pinchUsed = true;
    }, { passive: false });

    vp.addEventListener('touchend', e => {
        if (e.target.closest('.mine-object')) return;
        if (pinchState && e.touches.length < 2) {
            pinchState = null;
            updateCamera();
            lastTouch = Date.now();
            setTimeout(() => { pinchUsed = false; }, 450);
            return;
        }
        if (pinchUsed || e.touches.length > 0) return;
        const t = e.changedTouches[0];
        if (!t || !touchStart) return;
        if (Date.now() - touchStart.time > 600) { touchStart = null; return; }
        const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
        if (Math.hypot(dx, dy) > 22) { touchStart = null; return; }
        e.preventDefault();
        lastTouch = Date.now();
        onMoveTap(touchStart.x, touchStart.y);
        touchStart = null;
    }, { passive: false });

    vp.addEventListener('touchcancel', () => {
        touchStart = null;
        pinchState = null;
    });

    vp.addEventListener('click', e => {
        if (e.target.closest('.mine-object')) return;
        if (Date.now() - lastTouch < 450) return;
        onMoveTap(e.clientX, e.clientY);
    });
}

// ─── Ангар ───────────────────────────────────────────────────
function upgradeCost(key) {
    const lvl = state.upgrades[key];
    if (key === 'fuelTank') return { credits: 100 * 2**lvl, parts: 0 };
    return { credits: 50 * 2**lvl, parts: Math.ceil(5 * 1.5**lvl) };
}

function renderHangar() {
    const r = state.resources;
    const spreadHint = getUpgradeSpreadHint();
    $('hangar-ship').innerHTML = '';
    $('hangar-ship').appendChild(drawCurrentShip(5));
    $('hangar-ship').insertAdjacentHTML('beforeend', renderStatBarsHtml(getShipCombatStats()));
    $('hangar-ship').insertAdjacentHTML('beforeend',
        `<div class="hangar-balance-hint ${spreadHint.cls}">${spreadHint.text}</div>`);
    $('hangar-res').textContent = `🪙${Math.floor(r.credits)} ⛽${Math.floor(r.fuel)}/${state.maxFuel} 🛡️${r.shieldParts} ⚔️${r.weaponParts} 💎${r.spice} 🧩${r.shards}`;

    $('upgrade-list').innerHTML = UPGRADES.map(u => {
        const lvl = state.upgrades[u.key] ?? 0;
        const cost = upgradeCost(u.key);
        const spreadOk = canUpgradeCombatStat(u.key);
        const can = lvl < u.max && r.credits >= cost.credits && spreadOk;
        const bonus = COMBAT_UPGRADE_KEYS.includes(u.key) ? ` +${UPGRADE_STAT_BONUS}` : '';
        const blocked = COMBAT_UPGRADE_KEYS.includes(u.key) && !spreadOk
            ? `<span class="upgrade-blocked">Разрыв > ${UPGRADE_SPREAD_MAX}</span>` : '';
        return `<div class="upgrade-row"><span>${u.label} ${lvl}/${u.max}${bonus}${blocked}</span><button class="btn btn-sm" ${can?'':'disabled'} data-upg="${u.key}" title="${spreadOk ? '' : getCombatUpgradeBlockHint(u.key)}">${cost.credits}🪙</button></div>`;
    }).join('');

    $('upgrade-list').querySelectorAll('[data-upg]').forEach(btn => {
        btn.onclick = () => {
            const key = btn.dataset.upg;
            const u = UPGRADES.find(x => x.key === key);
            const cost = upgradeCost(key);
            if (state.upgrades[key] >= u.max || state.resources.credits < cost.credits) return;
            if (!canUpgradeCombatStat(key)) return;
            state.resources.credits -= cost.credits;
            state.upgrades[key]++;
            if (key === 'fuelTank') { state.maxFuel += 10; state.resources.fuel = Math.min(state.maxFuel, state.resources.fuel + 10); }
            Storage.save(); updateHUD(); renderHangar();
        };
    });

    $('artifact-list').innerHTML = ARTIFACTS.map(a => {
        const eq = state.artifact.id === a.id;
        return `<div class="card ${eq?'selected':''}" data-art="${a.id}"><div>${a.name}</div><div style="font-size:3px;margin-top:3px">${eq?'ур.'+state.artifact.level:'нет'}</div></div>`;
    }).join('');
}

// ─── PvP (упрощённый) ───────────────────────────────────────
function renderPvP() {
    $('pvp-my-ship').innerHTML = ''; $('pvp-en-ship').innerHTML = '';
    $('pvp-my-ship').appendChild(drawCurrentShip(3));
    const en = document.createElement('span'); en.textContent = '👾'; en.style.fontSize='22px';
    $('pvp-en-ship').appendChild(en);
    $('pvp-my-bars').innerHTML = '<div class="bar"><div class="bar-fill bar-shield" style="width:100%"></div></div><div class="bar"><div class="bar-fill bar-hp" style="width:100%"></div></div>';
    $('pvp-en-bars').innerHTML = '<div class="bar"><div class="bar-fill bar-shield" style="width:100%"></div></div><div class="bar"><div class="bar-fill bar-hp" style="width:100%"></div></div>';
    $('leaderboard').innerHTML = '<div style="color:var(--gold)">ТОП 10</div>' +
        state.leaderboard.slice(0,10).map((p,i)=>`<div>#${i+1} ${p.name}: ${p.score}</div>`).join('');
}

function startPvP() {
    const result = Math.random() > 0.45 ? 'win' : 'lose';
    if (result === 'win') { state.pvpScore += 15; $('pvp-status').textContent = 'ПОБЕДА! +15'; showLoot('+15 PvP'); }
    else { state.pvpScore = Math.max(0, state.pvpScore - 10); $('pvp-status').textContent = 'ПОРАЖЕНИЕ... -10'; }
    const idx = state.leaderboard.findIndex(p => p.name === state.playerName);
    if (idx >= 0) state.leaderboard[idx].score = state.pvpScore;
    else state.leaderboard.push({ name: state.playerName, score: state.pvpScore });
    state.leaderboard.sort((a,b) => b.score - a.score);
    Storage.save(); renderPvP();
}

// ─── Онбординг ───────────────────────────────────────────────
function renderFactions() {
    $('faction-list').innerHTML = FACTIONS.map(f =>
        `<button class="btn" style="border-color:${f.color};color:${f.color}" data-fid="${f.id}">
            ◆ ${f.name}<br><small style="font-size:4px">HP:${f.hp} Щ:${f.shield} У:${f.damage} СК:${f.attackSpeed}</small>
        </button>`
    ).join('');
    $('faction-list').querySelectorAll('[data-fid]').forEach(btn => {
        btn.onclick = () => {
            state.factionId = btn.dataset.fid;
            state.shipIndex = 0;
            Storage.save();
            renderShips();
            showWindow('ship');
        };
    });
}

function renderFactionBrief(faction) {
    const box = $('faction-brief');
    if (!box) return;
    if (!faction?.lore) {
        box.classList.add('hidden');
        box.innerHTML = '';
        return;
    }
    box.classList.remove('hidden');
    box.style.borderColor = faction.color + '55';
    box.innerHTML = `
        <div class="faction-brief-title" style="color:${faction.color}">${faction.name}${faction.subtitle ? ` (${faction.subtitle})` : ''}</div>
        <p>${faction.lore}</p>
        ${faction.strength ? `<p class="brief-plus"><strong>Сильная сторона (${faction.strengthLabel || '—'}):</strong> ${faction.strength}</p>` : ''}
        ${faction.weakness ? `<p class="brief-minus"><strong>Слабая сторона (${faction.weaknessLabel || '—'}):</strong> ${faction.weakness}</p>` : ''}
    `;
}

function renderShips() {
    const ships = getShipList();
    const faction = FACTIONS.find(f => f.id === state.factionId);
    const winShip = $('win-ship');
    const titleEl = $('ship-wtitle');
    if (titleEl) {
        if (faction) {
            titleEl.textContent = `${faction.name.toUpperCase()} — ВЫБЕРИ КОРАБЛЬ`;
            titleEl.style.color = faction.color;
        } else {
            titleEl.textContent = 'ВЫБЕРИ КОРАБЛЬ';
            titleEl.style.color = '';
        }
    }
    if (winShip) {
        winShip.style.borderColor = faction?.color || 'var(--accent)';
    }
    renderFactionBrief(faction);

    $('ship-list').innerHTML = ships.map((ship, i) =>
        `<div class="card ${(state.shipIndex ?? -1) === i ? 'selected' : ''}" data-ship="${i}">
            <div class="ship-name">${ship.name}</div>
            <div class="ship-preview" data-preview="${i}"></div>
            ${renderFactionStatBarsHtml(faction)}
        </div>`
    ).join('');

    $('ship-list').querySelectorAll('[data-ship]').forEach(card => {
        const i = +card.dataset.ship;
        card.querySelector('[data-preview]').appendChild(
            renderShipGraphic(ships[i], state.factionId, 6)
        );
        if (faction && (state.shipIndex ?? -1) !== i) card.style.borderColor = faction.color;
        card.onclick = () => {
            state.shipIndex = i;
            Storage.save();
            renderShips();
            $('btn-ship-confirm').disabled = false;
        };
    });

    if (state.shipIndex !== null && state.shipIndex !== undefined) {
        $('btn-ship-confirm').disabled = false;
    } else {
        $('btn-ship-confirm').disabled = true;
    }
}

function completeProfile() {
    state.profileComplete = true;
    Storage.save();
    showGameUI();
    switchTab('mining');
}

function resumeOrStart() {
    if (state.profileComplete) {
        showGameUI();
        switchTab('mining');
        updateHUD();
        return;
    }
    $('inp-name').value = state.playerName || '';
    $('start-hint')?.classList.add('hidden');
    showWindow('start');
}

async function resetGame() {
    state = defaultState();
    state.profileComplete = false;

    shipPos = { x: 0, y: 0 };
    shipRotation = 0;
    shipTarget = null;
    camera = { x: 0, y: 0 };
    mapZoom = 1;
    if (shipAnimFrame) cancelAnimationFrame(shipAnimFrame);
    shipAnimFrame = null;
    shipFlying = false;
    returningToPlanet = false;
    stopPiratePatrol();
    mineObjects = [];
    if (window._neonFlickerTimer) { clearInterval(window._neonFlickerTimer); window._neonFlickerTimer = null; }
    if (planetFlashTimer) { clearInterval(planetFlashTimer); planetFlashTimer = null; }
    if (planetSparkTimer) { clearInterval(planetSparkTimer); planetSparkTimer = null; }
    stopPlanetSpin();
    planetRenderState = null;
    planetActiveSparks = [];
    planetSparkUntil = 0;
    $('ship-flame')?.getContext('2d')?.clearRect(0, 0, 5, 10);
    $('ship-flame')?.classList.remove('active');
    $('mining-world')?.querySelectorAll('.mine-object, .mine-loot').forEach(el => el.remove());
    delete $('mining-world')?.dataset.planet;

    await Storage.saveAsync();

    $('mining-screen').classList.remove('active');
    $('top-panel').classList.add('hidden');
    $('bottom-nav').classList.add('hidden');
    $('btn-ship-confirm').disabled = true;
    $('inp-name').value = '';
    $('start-hint')?.classList.add('hidden');
    showWindow('start');
    updateHUD();
}

// ─── Инициализация ───────────────────────────────────────────
function bindEvents() {
    $('btn-start').onclick = () => {
        const name = $('inp-name').value.trim();
        const hint = $('start-hint');
        if (name.length < 2) {
            hint.textContent = 'Минимум 2 символа';
            hint.classList.remove('hidden');
            return;
        }
        hint.classList.add('hidden');
        state.playerName = name;
        Storage.save();
        renderFactions();
        showWindow('faction');
    };

    $('btn-ship-confirm').onclick = completeProfile;

    $('btn-ship-back').onclick = () => {
        showWindow('faction');
    };

    $('btn-reset').onclick = async () => {
        if (!confirm('Сбросить прогресс и выбрать фракцию заново?')) return;
        await resetGame();
    };

    document.querySelectorAll('[data-tab]').forEach(btn => {
        btn.onclick = () => switchTab(btn.dataset.tab);
    });

    document.querySelectorAll('[data-open]').forEach(btn => {
        btn.onclick = () => showWindow(btn.dataset.open);
    });

    $('btn-pvp').onclick = startPvP;
    $('btn-checkin').onclick = () => {
        if (state.checkin.claimedToday) return alert('Уже забрали сегодня');
        state.resources.credits += 20; state.resources.fuel = Math.min(state.maxFuel, state.resources.fuel + 5);
        state.checkin.claimedToday = true; state.checkin.day = Math.min(7, state.checkin.day + 1);
        Storage.save(); updateHUD(); showLoot('+20 🪙 +5 ⛽');
    };

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') Storage.save();
        if (document.visibilityState === 'visible') {
            applyGameInsets();
            syncPanelHeights();
            onMiningResize();
        }
    });
    window.addEventListener('pagehide', () => Storage.save());
    const relayout = () => {
        syncPanelHeights();
        applyGameInsets();
        onMiningResize();
    };
    window.addEventListener('resize', relayout);
    window.addEventListener('orientationchange', () => setTimeout(relayout, 150));
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', relayout);
        window.visualViewport.addEventListener('scroll', relayout);
    }
    if (typeof ResizeObserver !== 'undefined') {
        const ro = new ResizeObserver(() => relayout());
        const top = $('top-panel');
        const nav = document.querySelector('.bottom-nav');
        const mvp = $('mining-viewport');
        if (top) ro.observe(top);
        if (nav) ro.observe(nav);
        if (mvp) ro.observe(mvp);
    }
}

async function boot() {
    initTelegram();
    applyGameInsets();
    syncPanelHeights();
    fillStars($('stars-global'), 380);
    initMiningTap();
    await Storage.load();
    bindEvents();
    resumeOrStart();
    updateHUD();

    // Восстановление топлива
    setInterval(() => {
        if (state.resources.fuel < state.maxFuel) {
            state.resources.fuel = Math.min(state.maxFuel, state.resources.fuel + 1);
            updateHUD();
            Storage.save();
        }
    }, 4 * 60 * 1000);
}

document.addEventListener('DOMContentLoaded', boot);
</script>
