<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Space Dream v2.16.1</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        :root {
            --bg: #000;
            --text: #cc3333;
            --accent: #00aa44;
            --gold: #bb9922;
            --panel: rgba(2, 2, 14, 0.95);
            --game-inset-top: env(safe-area-inset-top, 0px);
            --game-inset-bottom: env(safe-area-inset-bottom, 0px);
            --game-inset-left: env(safe-area-inset-left, 0px);
            --game-inset-right: env(safe-area-inset-right, 0px);
            --panel-top-h: 72px;
            --panel-bottom-h: 72px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Press Start 2P', monospace;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            position: fixed;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            padding: 0;
        }

        /* ── Звёзды ── */
        .stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 40%, #0a1035 0%, #000 70%); }
        .star { position: absolute; border-radius: 50%; background: #fff; animation: twinkle var(--d, 2s) infinite; animation-delay: var(--delay, 0s); }
        @keyframes twinkle { 0%,100% { opacity: .15; transform: scale(.8); } 50% { opacity: .9; transform: scale(1.2); } }
        @keyframes planetSlowSpin {
            from { transform: rotate(0deg) translateZ(0); }
            to { transform: rotate(360deg) translateZ(0); }
        }

        /* ── Верхняя панель ── */
        .top-panel {
            position: fixed;
            top: var(--game-inset-top);
            left: var(--game-inset-left);
            right: var(--game-inset-right);
            z-index: 100;
            background: transparent;
            padding: 0;
            overflow: visible;
            pointer-events: none;
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            font-weight: 300;
        }
        .top-panel-inner {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            padding: 5px 6px 0;
            pointer-events: none;
        }
        .top-upper {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            min-height: 38px;
            background: rgba(0, 0, 0, 0.92);
            margin: -5px -6px 0;
            padding: 5px 6px 4px;
            pointer-events: auto;
        }

        /* Блок игрока — слева: аватар + VIP / ник / lvl */
        .top-player {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            max-width: 28vw;
            align-self: center;
        }
        .top-player .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            background: #222 center/cover no-repeat;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
            overflow: hidden;
        }
        .top-player .avatar.has-photo {
            color: transparent;
        }
        .player-meta {
            display: flex;
            flex-direction: column;
            gap: 0;
            min-width: 0;
        }
        .player-vip {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.07em;
            color: #ffd400;
            white-space: nowrap;
            text-shadow: 0 0 6px rgba(255, 212, 0, 0.45);
            margin-bottom: 2px;
        }
        .top-player .pname {
            font-size: 10px;
            line-height: 1.25;
            font-weight: 300;
            letter-spacing: 0.04em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #eef2fa;
        }
        .top-player .plevel {
            font-size: 9px;
            color: #8a93a8;
            font-weight: 400;
            letter-spacing: 0.08em;
            margin-top: 3px;
            padding-top: 3px;
            border-top: 1px solid rgba(255, 255, 255, 0.07);
        }

        /* Ресурсы — одна линия, спайс в центре и крупнее */
        .top-resources {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr auto auto auto auto 1fr;
            align-items: center;
            column-gap: 5px;
            align-self: center;
            min-width: 0;
        }
        .resource-fuel    { grid-column: 2; }
        .resource-credits { grid-column: 3; }
        .resource-spice   { grid-column: 4; }
        .resource-shards  { grid-column: 5; }
        .top-panel .resource-neon {
            --neon-color: #00e8ff;
            --neon-glow: rgba(0, 232, 255, 0.95);
            background: rgba(0, 0, 0, 0.88);
            border: 2px solid var(--neon-color);
            color: var(--neon-color);
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            font-weight: 500;
            letter-spacing: 0.06em;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 2px;
            white-space: nowrap;
            box-shadow:
                0 0 6px var(--neon-glow),
                0 0 14px var(--neon-glow),
                inset 0 0 10px rgba(255, 255, 255, 0.05);
            text-shadow: 0 0 6px var(--neon-glow);
        }
        .resource-spice {
            font-size: 12px;
            font-weight: 600;
            padding: 4px 11px;
            border-width: 2px;
            transform: scale(1.08);
            z-index: 2;
            box-shadow:
                0 0 10px var(--neon-glow),
                0 0 22px var(--neon-glow),
                0 0 36px rgba(255, 92, 244, 0.45),
                inset 0 0 14px rgba(255, 255, 255, 0.08);
            text-shadow: 0 0 10px var(--neon-glow), 0 0 18px var(--neon-glow);
        }
        .neon-cyan   { --neon-color: #00e8ff; --neon-glow: rgba(0, 232, 255, 0.85); }
        .neon-magenta{ --neon-color: #ff2bd6; --neon-glow: rgba(255, 43, 214, 0.85); }
        .neon-lime   { --neon-color: #b8ff00; --neon-glow: rgba(184, 255, 0, 0.85); }
        .neon-orange { --neon-color: #ff6a1a; --neon-glow: rgba(255, 106, 26, 0.85); }
        .neon-gold   { --neon-color: #ffd400; --neon-glow: rgba(255, 212, 0, 0.85); }
        .neon-pink   { --neon-color: #ff5cf4; --neon-glow: rgba(255, 92, 244, 0.85); color: #ffe8ff; }
        .neon-blue   { --neon-color: #4da6ff; --neon-glow: rgba(77, 166, 255, 0.85); }
        .neon-green  { --neon-color: #45ff9a; --neon-glow: rgba(69, 255, 154, 0.85); }

        @keyframes neonBurnout {
            0%, 100% { opacity: 1; filter: brightness(1); }
            4%  { opacity: 0.08; filter: brightness(0.04); }
            7%  { opacity: 1; filter: brightness(2.4); }
            10% { opacity: 0.06; filter: brightness(0.03); }
            13% { opacity: 0.9; filter: brightness(1.4); }
            16% { opacity: 1; filter: brightness(1); }
        }
        .top-panel .resource-neon.neon-flicker {
            animation: neonBurnout 1.1s linear forwards;
        }

        /* Зелёная полоска — нижняя граница HUD-бара */
        .top-divider {
            height: 0;
            border: none;
            border-top: 1px solid var(--accent);
            margin: 4px 0 0;
            box-shadow: 0 0 6px rgba(0, 170, 68, 0.35);
            background: transparent;
            pointer-events: none;
        }

        /* ── Единое игровое поле ── */
        .mining-screen {
            position: fixed;
            top: var(--game-inset-top);
            bottom: calc(var(--game-inset-bottom) + var(--panel-bottom-h));
            left: var(--game-inset-left);
            right: var(--game-inset-right);
            z-index: 1;
            display: none;
            overflow: hidden;
            background: transparent;
        }
        .mining-screen.active { display: block; }
        .mining-viewport {
            position: absolute;
            top: var(--panel-top-h);
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            overflow: hidden;
            touch-action: none;
            cursor: crosshair;
            background: transparent;
        }
        /* HUD-кнопки — зафиксированы на экране, часть игрового поля */
        .mining-hud {
            position: absolute;
            top: var(--panel-top-h);
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 4;
            pointer-events: none;
        }
        .mining-hud-actions {
            position: absolute;
            top: 6px;
            right: 6px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 3px;
            pointer-events: auto;
        }
        .btn-action {
            --action-neon: #b80030;
            --action-glow: rgba(184, 0, 48, 0.85);
            -webkit-appearance: none;
            appearance: none;
            font-family: 'Rajdhani', 'Segoe UI', sans-serif;
            font-size: 7px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #ffb0ba;
            cursor: pointer;
            width: 72px;
            height: 34px;
            padding: 1px 3px;
            line-height: 1.05;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--action-neon);
            border-radius: 5px;
            background-color: #180008;
            background-image:
                linear-gradient(180deg, rgba(255, 120, 140, 0.12) 0%, transparent 40%),
                linear-gradient(180deg, #5a001c 0%, #320010 52%, #180008 100%);
            box-shadow:
                0 3px 0 #220008,
                0 4px 12px rgba(0, 0, 0, 0.5),
                0 0 10px var(--action-glow),
                inset 0 1px 0 rgba(255, 140, 150, 0.25),
                inset 0 -2px 4px rgba(0, 0, 0, 0.45);
            text-shadow: 0 0 6px var(--action-glow);
            transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.08s ease;
        }
        .btn-action:active {
            transform: translateY(2px);
            filter: brightness(1.15);
            box-shadow:
                0 1px 0 #220008,
                0 2px 6px rgba(0, 0, 0, 0.45),
                0 0 14px var(--action-glow),
                inset 0 2px 6px rgba(0, 0, 0, 0.5);
        }

        /* ── Нижняя навигация ── */
        .bottom-nav {
            position: fixed;
            bottom: var(--game-inset-bottom);
            left: var(--game-inset-left);
            right: var(--game-inset-right);
            z-index: 100;
            min-height: 72px; background: rgba(2,2,10,.96); border-top: 1px solid var(--accent);
            display: flex; align-items: center; justify-content: space-around; padding: 4px;
        }
        .nav-btn {
            flex: 1; margin: 0 2px; max-width: 88px; padding: 6px 4px;
            background: #040c04; border: 1px solid var(--accent); color: var(--text);
            font-family: inherit; font-size: 5px; cursor: pointer; text-align: center;
        }
        .nav-btn.active { background: #061806; border-color: var(--gold); }
        .nav-btn-reset {
            border-color: #aa3333;
            color: #ff7777;
            max-width: 58px;
            flex: 0.85;
        }

        .mining-world {
            position: absolute; left: 0; top: 0;
            will-change: transform;
            background: transparent;
            box-sizing: border-box;
            border: 1px solid rgba(0, 170, 68, .35);
        }
        .mining-tap { display: none; }
        .mining-hub {
            position: absolute;
            transform: translate(-50%, -50%);
            width: 480px; aspect-ratio: 1;
            pointer-events: none; z-index: 3;
            isolation: isolate;
        }
        .planet-wrap {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            clip-path: circle(50% at 50% 50%);
            overflow: hidden;
            background: transparent;
        }
        .planet-canvas {
            width: 100%; height: 100%; display: block;
            image-rendering: auto;
        }
        .player-ship {
            position: absolute; z-index: 10; pointer-events: none;
            transform: translate(-50%, -50%);
            transition: none;
        }
        .player-ship img {
            position: relative;
            z-index: 1;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            height: 56px;
            width: auto;
            pointer-events: none;
        }
        .player-ship canvas {
            position: relative;
            z-index: 1;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            height: 56px;
            width: auto;
            pointer-events: none;
        }
        .ship-flame {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 12px;
            height: 30px;
            transform: translate(-50%, 17px);
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
        }
        .player-ship.flying .ship-flame { opacity: 1; }
        .laser-layer {
            position: absolute; left: 0; top: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 35; overflow: visible;
        }
        .laser-beam {
            stroke: #40e8ff; stroke-width: 2; stroke-linecap: round;
            filter: drop-shadow(0 0 4px #40e8ff);
            animation: laserPulse .35s ease-in-out infinite alternate;
        }
        .laser-beam.laser-blue {
            stroke: #4488ff;
            filter: drop-shadow(0 0 5px #4488ff);
        }
        .laser-beam.laser-red {
            stroke: #ff3333;
            filter: drop-shadow(0 0 5px #ff3333);
        }
        @keyframes laserPulse { from { opacity: .55; stroke-width: 1.5; } to { opacity: 1; stroke-width: 2.5; } }
        .sound-wave {
            fill: none;
            stroke: rgba(255, 255, 255, 1);
            stroke-width: 3.5;
            stroke-linecap: round;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, .95));
            animation: soundWavePulse .55s ease-out infinite;
        }
        @keyframes soundWavePulse {
            0% { opacity: .95; stroke-width: 3; }
            100% { opacity: .12; stroke-width: 1; }
        }
        .mine-object {
            position: absolute; z-index: 25; transform: translate(-50%, -50%);
            cursor: pointer; pointer-events: auto;
            filter: drop-shadow(0 0 6px rgba(255,200,80,.45));
            transition: opacity .3s, transform .2s;
            min-width: 56px; min-height: 56px;
            display: flex; align-items: center; justify-content: center;
            touch-action: manipulation;
        }
        .mine-object canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            pointer-events: none;
        }
        .mine-object:active { transform: translate(-50%, -50%) scale(1.12); }
        .ship-sprite-img {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            max-width: 100%;
            height: auto;
            pointer-events: none;
        }
        .ship-preview .ship-sprite-img { max-height: 200px; width: auto; }

        /* ── Окна ── */
        .overlay {
            position: fixed;
            top: calc(var(--game-inset-top) + var(--panel-top-h));
            bottom: calc(var(--game-inset-bottom) + var(--panel-bottom-h));
            left: var(--game-inset-left);
            right: var(--game-inset-right);
            z-index: 50; display: none; align-items: center; justify-content: center;
            pointer-events: none;
        }
        .overlay.active { display: flex; }
        .overlay > .window { pointer-events: all; }
        .window {
            background: var(--panel); border: 1px solid var(--accent);
            padding: 12px; width: 90%; max-width: 340px; max-height: 65vh;
            overflow-y: auto; animation: slideUp .3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .wtitle { color: var(--gold); font-size: 7px; text-align: center; margin-bottom: 8px; }
        .input { width: 100%; padding: 6px; margin: 6px 0; background: #040410; border: 2px solid var(--accent); color: var(--text); font-family: inherit; font-size: 6px; text-align: center; }
        .start-hint { font-size: 5px; color: #ff6666; text-align: center; min-height: 10px; margin-top: 2px; }
        .btn { width: 100%; padding: 7px; margin: 5px 0; background: #040c04; border: 2px solid var(--accent); color: var(--text); font-family: inherit; font-size: 6px; cursor: pointer; }
        .btn:disabled { opacity: .4; cursor: not-allowed; }
        .btn-sm { width: auto; padding: 3px 6px; font-size: 4px; }
        .hidden { display: none !important; }
        .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
        .card { border: 2px solid var(--accent); padding: 8px; text-align: center; cursor: pointer; font-size: 5px; width: 100%; display: flex; flex-direction: column; align-items: center; }
        .ship-name { font-size: 6px; color: var(--gold); margin-bottom: 4px; }
        .ship-desc { font-size: 4px; color: #888; margin-bottom: 8px; line-height: 1.6; }
        .ship-preview {
            width: 100%; min-height: 200px; display: flex; align-items: center; justify-content: center;
            background: radial-gradient(ellipse at 50% 50%, rgba(20,24,48,.9) 0%, transparent 72%);
            border: 1px solid rgba(0,170,68,.25); border-radius: 4px; padding: 10px 4px;
        }
        .ship-preview canvas { image-rendering: pixelated; image-rendering: crisp-edges; max-width: 100%; height: auto; }
        #win-ship { max-width: 360px; max-height: 78vh; }
        #ship-list { flex-direction: column; gap: 12px; width: 100%; align-items: stretch; }
        .card.selected { border-color: #ffaa00; box-shadow: 0 0 12px rgba(255,170,0,.25); }
        .upgrade-row { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--accent); padding: 4px; margin: 3px 0; font-size: 5px; }
        .mine-loot {
            position: absolute; z-index: 40;
            transform: translate(-50%, -50%);
            font-size: 8px; font-weight: 300; letter-spacing: 0.4px;
            color: #ffe566;
            text-shadow: 0 0 8px rgba(0,0,0,.95), 0 0 3px #000, 1px 1px 0 #000;
            white-space: nowrap; pointer-events: none;
            animation: mineLootFade 2.5s ease-out forwards;
        }
        @keyframes mineLootFade {
            0% { opacity: 0; transform: translate(-50%, -40%) scale(0.9); }
            12% { opacity: 1; transform: translate(-50%, -55%) scale(1); }
            78% { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, -75%) scale(1.02); }
        }
        .loot-feed { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); z-index: 200; pointer-events: none; display: flex; gap: 6px; flex-wrap: wrap; }
        .loot { font-size: 6px; font-weight: 300; color: #ffcc00; background: rgba(0,0,0,.85); padding: 4px 8px; animation: fadeLoot 2.5s forwards; }
        @keyframes fadeLoot { 0% { opacity:0; transform:translateY(8px); } 15%,80% { opacity:1; transform:translateY(0); } 100% { opacity:0; transform:translateY(-8px); } }

        /* PvP */
        .pvp-grid { display: flex; align-items: center; gap: 4px; }
        .pvp-side { flex: 1; text-align: center; font-size: 5px; }
        .bar { height: 8px; background: #333; border: 1px solid var(--accent); margin: 3px 0; overflow: hidden; }
        .bar-fill { height: 100%; transition: width .2s; }
        .bar-shield { background: #4488ff; }
        .bar-hp { background: var(--accent); }
    </style>
</head>
<body>

<div class="stars" id="stars-global"></div>

<!-- Верхняя панель -->
<div class="top-panel hidden" id="top-panel">
    <div class="top-panel-inner">
    <div class="top-upper">
        <div class="top-player">
            <div class="avatar" id="avatar">?</div>
            <div class="player-meta">
                <div class="player-vip" id="ui-vip">⭐ VIP 0</div>
                <div class="pname" id="ui-name">Игрок</div>
                <div class="plevel" id="ui-level">Lvl 1</div>
            </div>
        </div>
        <div class="top-resources">
            <div class="resource-neon neon-blue resource-fuel">⛽ <span id="ui-fuel">100</span></div>
            <div class="resource-neon neon-gold resource-credits">🪙 <span id="ui-credits">0</span></div>
            <div class="resource-neon neon-pink resource-spice">💎 <span id="ui-spice">0</span></div>
            <div class="resource-neon neon-green resource-shards">🧩 <span id="ui-shards">0</span></div>
        </div>
    </div>
    <hr class="top-divider">
    </div>
</div>

<!-- Экран добычи — единое поле -->
<div class="mining-screen" id="mining-screen">
    <div class="mining-hud" id="mining-hud">
        <div class="mining-hud-actions">
            <button class="btn-action" data-open="battlepass">🎫<br>БАТЛ-ПАСС</button>
            <button class="btn-action" data-open="boosts">⚡<br>УСИЛЕНИЯ</button>
            <button class="btn-action" data-open="checkin">📅<br>ЧЕКИН</button>
        </div>
    </div>
    <div class="mining-viewport" id="mining-viewport">
        <div class="mining-world" id="mining-world">
            <div class="mining-hub" id="mining-hub">
                <div class="planet-wrap" id="planet-wrap"></div>
            </div>
            <svg class="laser-layer" id="laser-layer"></svg>
            <div class="player-ship" id="player-ship"></div>
        </div>
        <div class="mining-tap" id="mining-tap"></div>
    </div>
</div>

<div class="loot-feed" id="loot-feed"></div>

<!-- Окна -->
<div class="overlay active" id="overlay">
    <div class="window" id="win-start">
        <div class="wtitle">SPACE DREAM</div>
        <input class="input" id="inp-name" placeholder="ИМЯ ИГРОКА" maxlength="12">
        <div class="start-hint hidden" id="start-hint"></div>
        <button class="btn" id="btn-start">ДАЛЕЕ</button>

function drawPixelMatrix(ctx, px, matrix, palette) {
    const mh = matrix.length, mw = matrix[0].length;
    const ox = Math.floor((SHIP_W - mw) / 2), oy = Math.floor((SHIP_H - mh) / 2);
    for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) {
        const c = matrix[y][x];
        if (!c || !palette[c]) continue;
        ctx.fillStyle = palette[c];
        ctx.fillRect((ox + x) * px, (oy + y) * px, px, px);
    }
}

function drawMap(ctx, px, p, map) {
    const mh = map.length, mw = Math.max(...map.map(r => r.length));
    const ox = Math.floor((SHIP_W - mw) / 2), oy = Math.floor((SHIP_H - mh) / 2);
    for (let y = 0; y < mh; y++) for (let x = 0; x < map[y].length; x++) {
        const ch = map[y][x];
        if (ch === '.' || ch === ' ') continue;
        const col = (ch >= '1' && ch <= '8') ? p[+ch] : SHIP_EXTRA[ch];
        if (!col) continue;
        ctx.fillStyle = col;
        ctx.fillRect((ox + x) * px, (oy + y) * px, px, px);
    }
}

function applyOutline(ctx, px) {
    const w = ctx.canvas.width, h = ctx.canvas.height;
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    const src = new Uint8ClampedArray(d);
    const solid = i => src[i + 3] > 30;
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            if (solid(i)) continue;
            let edge = false;
            for (let dy = -px; dy <= px && !edge; dy += px) {
                for (let dx = -px; dx <= px && !edge; dx += px) {
                    if (!dx && !dy) continue;
                    const nx = x + dx, ny = y + dy;
                    if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
                    if (solid((ny * w + nx) * 4)) edge = true;
                }
            }
            if (edge) { d[i] = 6; d[i + 1] = 6; d[i + 2] = 14; d[i + 3] = 255; }
        }
    }
    ctx.putImageData(img, 0, 0);
}

const Storage = {
    cloud() {
        try { return window.Telegram?.WebApp?.CloudStorage || null; }
        catch (e) { return null; }
    },

    save() {
        const json = JSON.stringify(state);
        try { localStorage.setItem(SAVE_KEY, json); } catch (e) {}
        try {
            const cloud = this.cloud();
            if (cloud) cloud.setItem(SAVE_KEY, json, () => {});
        } catch (e) { /* CloudStorage недоступен в части WebView */ }
    },

    saveAsync() {
        return new Promise(resolve => {
            const json = JSON.stringify(state);
            try { localStorage.setItem(SAVE_KEY, json); } catch (e) {}
            try {
                const cloud = this.cloud();
                if (cloud) {
                    cloud.setItem(SAVE_KEY, json, () => resolve());
                    return;
                }
            } catch (e) {}
            resolve();
        });
    },

    loadLocal() {
        try {
            const raw = localStorage.getItem(SAVE_KEY);
            if (raw) return { ...defaultState(), ...JSON.parse(raw) };
        } catch (e) {}
        return defaultState();
    },

    loadCloud() {
        return new Promise(resolve => {
            let settled = false;
            const finish = val => {
                if (settled) return;
                settled = true;
                resolve(val);
            };
            setTimeout(() => finish(null), 2500);
            try {
                const cloud = this.cloud();
                if (!cloud) return finish(null);
                cloud.getItem(SAVE_KEY, (err, val) => {
                    if (err || !val) return finish(null);
                    try { finish({ ...defaultState(), ...JSON.parse(val) }); }
                    catch (e) { finish(null); }
                });
            } catch (e) {
                finish(null);
            }
        });
    },

    pickBestSave(local, cloud) {
        if (!cloud) return local;
        if (!local?.playerName && !local?.profileComplete) return cloud;
        if (!cloud.playerName && !cloud.profileComplete) return local;
        if (local.profileComplete && !cloud.profileComplete) return local;
        if (cloud.profileComplete && !local.profileComplete) return cloud;
        return cloud.playerName ? cloud : local;
    },

    async load() {
        const local = this.loadLocal();
        const cloud = await this.loadCloud();
        state = this.pickBestSave(local, cloud);
        if (state.factionId != null) {
            const list = SHIP_CATALOG[state.factionId] || SHIP_CATALOG.tank;
            if (state.shipIndex == null || state.shipIndex < 0) state.shipIndex = 0;
            if (state.shipIndex >= list.length) state.shipIndex = list.length - 1;
        }
        if (!state.profileComplete && state.playerName && state.factionId !== null && state.shipIndex !== null) {
            state.profileComplete = true;
        }
    },
};

function getMiningViewportMetrics() {
    const vp = $('mining-viewport');
    if (!vp) return { w: 360, h: 560, ox: 0, oy: 0 };
    const rect = vp.getBoundingClientRect();
    let w = rect.width;
    let h = rect.height;
    let ox = 0;
    let oy = 0;
    const vv = window.visualViewport;
    if (vv && w > 0 && h > 0) {
        const left = Math.max(rect.left, vv.offsetLeft);
        const top = Math.max(rect.top, vv.offsetTop);
        const right = Math.min(rect.left + w, vv.offsetLeft + vv.width);
        const bottom = Math.min(rect.top + h, vv.offsetTop + vv.height);
        w = Math.max(1, right - left);
        h = Math.max(1, bottom - top);
        ox = left - rect.left;
        oy = top - rect.top;
    }
    if (w < 1 || h < 1) {
        w = Math.max(1, vp.clientWidth || 360);
        h = Math.max(1, vp.clientHeight || 560);
        ox = 0;
        oy = 0;
    }
    return { w, h, ox, oy };
}

function updateCamera() {
    const vp = $('mining-viewport');
    if (!vp) return;
    const { w: vw, h: vh, ox, oy } = getMiningViewportMetrics();
    const focusX = ox + vw / 2;
    const focusY = oy + vh / 2;
    let cx = MAP_CENTER.x - focusX;
    let cy = MAP_CENTER.y - focusY;
    const sx = shipPos.x - cx;
    const sy = shipPos.y - cy;
    const padX = vw * 0.3;
    const padY = vh * 0.3;
    if (sx < padX) cx = shipPos.x - padX;
    else if (sx > vw - padX) cx = shipPos.x - (vw - padX);
    if (sy < padY) cy = shipPos.y - padY;
    else if (sy > vh - padY) cy = shipPos.y - (vh - padY);
    cx = Math.max(0, Math.min(worldBounds.width - vw, cx));
    cy = Math.max(0, Math.min(worldBounds.height - vh, cy));
    camera.x = cx;
    camera.y = cy;
    $('mining-world').style.transform = `translate3d(${-Math.round(cx)}px, ${-Math.round(cy)}px, 0)`;
}

function drawShipFlame(cvs, frame) {
    const ctx = cvs.getContext('2d');
    ctx.clearRect(0, 0, cvs.width, cvs.height);
    ctx.imageSmoothingEnabled = false;
    const wobble = frame % 3;
    const sway = (frame % 2 === 0) ? 0 : (frame % 4 === 1 ? 1 : -1);
    const cx = 2 + sway;
    const baseY = 1 + wobble;

    // Тонкий шлейф 1 px
    ctx.fillStyle = '#662200';
    ctx.fillRect(cx, baseY + 7 + wobble, 1, 1);
    ctx.fillStyle = '#994400';
    ctx.fillRect(cx, baseY + 6, 1, 1);

    // Узкий столб пламени ~1 px
    ctx.fillStyle = '#ff4400';
    ctx.fillRect(cx, baseY + 2, 1, 4 + wobble);
    ctx.fillStyle = '#ff9900';
    ctx.fillRect(cx, baseY + 1, 1, 2);
    ctx.fillStyle = '#ffdd55';
    ctx.fillRect(cx, baseY + 2, 1, 1);
    if (sway !== 0) {
        ctx.fillStyle = '#ff6600';
        ctx.fillRect(cx - sway, baseY + 3, 1, 2);
    }
}

function getShipNose(offset = 28) {
    const rad = (shipRotation - 90) * Math.PI / 180;
    return { x: shipPos.x + Math.cos(rad) * offset, y: shipPos.y + Math.sin(rad) * offset };
}

function approachPoint(tx, ty, stopDist) {
    const dx = tx - shipPos.x, dy = ty - shipPos.y;
    const dist = Math.hypot(dx, dy);
    if (dist <= stopDist) return { x: shipPos.x, y: shipPos.y };
    const k = (dist - stopDist) / dist;
    return { x: shipPos.x + dx * k, y: shipPos.y + dy * k };
}

function ensureShipFlightLoop() {
    if (shipAnimFrame) return;
    let last = performance.now();

    const tick = now => {
        if (!shipTarget) {
            shipAnimFrame = null;
            return;
        }

        const dt = Math.min(0.05, (now - last) / 1000);
        last = now;

        const dx = shipTarget.x - shipPos.x;
        const dy = shipTarget.y - shipPos.y;
        const dist = Math.hypot(dx, dy);

        if (dist < 3) {
            shipPos.x = shipTarget.x;
            shipPos.y = shipTarget.y;
            const onArrive = shipTarget.onArrive;
            shipTarget = null;
            updateShipVisual();
            if (onArrive) onArrive();
            shipAnimFrame = shipTarget ? requestAnimationFrame(tick) : null;
            return;
        }

        // Нос корабля смотрит вверх на спрайте → +90° к углу движения
        const targetRot = Math.atan2(dy, dx) * 180 / Math.PI + 90;
        shipRotation = lerpAngle(shipRotation, targetRot, SHIP_ROT_LERP);

        const step = SHIP_MOVE_SPEED * dt;
        const move = Math.min(step, dist);
        shipPos.x += (dx / dist) * move;
        shipPos.y += (dy / dist) * move;
        shipPos = clampWorld(shipPos.x, shipPos.y);
        updateShipVisual();

        shipAnimFrame = requestAnimationFrame(tick);
    };

    shipAnimFrame = requestAnimationFrame(tick);
}

function flyShipTo(x, y, onArrive) {
    const p = clampWorld(x, y);
    shipTarget = { x: p.x, y: p.y, onArrive };
    ensureShipFlightLoop();
}

function sealCanvasOpaque(ctx, cx, cy, r) {
    const w = ctx.canvas.width;
    const h = ctx.canvas.height;
    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;
    const r2 = r * r;
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            const i = (y * w + x) * 4;
            const dx = x - cx;
            const dy = y - cy;
            if (dx * dx + dy * dy > r2) {
                d[i + 3] = 0;
                continue;
            }
            if (d[i + 3] >= 255) continue;
            const a = d[i + 3] / 255;
            if (a < 0.04) {
                d[i + 3] = 0;
                continue;
            }
            d[i] = Math.min(255, Math.round(d[i] / a));
            d[i + 1] = Math.min(255, Math.round(d[i + 1] / a));
            d[i + 2] = Math.min(255, Math.round(d[i + 2] / a));
            d[i + 3] = 255;
        }
    }
    ctx.putImageData(img, 0, 0);
}

function stopPlanetSpin() {
    if (planetSpinRaf) cancelAnimationFrame(planetSpinRaf);
    planetSpinRaf = null;
}

function paintPlanetSurface() {
    if (!planetRenderState) return;
    const st = planetRenderState;
    const { ctx, cx, cy, radius, size, img, imgW, imgH, dpr } = st;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, size, size);
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
    ctx.clip();
    ctx.translate(cx, cy);
    ctx.rotate(planetSpinAngle);
    ctx.translate(-cx, -cy);
    const diam = radius * 2;
    const scale = Math.max(diam / imgW, diam / imgH);
    const drawW = imgW * scale;
    const drawH = imgH * scale;
    ctx.drawImage(img, cx - drawW / 2, cy - drawH / 2, drawW, drawH);
    ctx.restore();
    sealCanvasOpaque(ctx, cx * dpr, cy * dpr, radius * dpr);

    if (planetActiveSparks.length && performance.now() < planetSparkUntil) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, radius - 1, 0, Math.PI * 2);
        ctx.clip();
        for (const s of planetActiveSparks) drawSpiceSparkle(ctx, s.x, s.y, s.kind);
        ctx.restore();
    }

    st.base = ctx.getImageData(0, 0, ctx.canvas.width, ctx.canvas.height);
}

function startPlanetSpin() {
    stopPlanetSpin();
    const tick = () => {
        if (!planetRenderState) return;
        planetSpinAngle += 0.00027;
        if (planetSpinAngle > Math.PI * 2) planetSpinAngle -= Math.PI * 2;
        paintPlanetSurface();
        planetSpinRaf = requestAnimationFrame(tick);
    };
    planetSpinRaf = requestAnimationFrame(tick);
}

function drawSpiceSparkle(ctx, x, y, kind = Math.floor(Math.random() * 4)) {
    ctx.imageSmoothingEnabled = false;
    const ix = Math.floor(x);
    const iy = Math.floor(y);
    const core = SPICE_SPARK_CORE[Math.floor(Math.random() * SPICE_SPARK_CORE.length)];
    const halo = SPICE_SPARK_HALO[Math.floor(Math.random() * SPICE_SPARK_HALO.length)];

    if (kind === 0) {
        ctx.fillStyle = halo;
        ctx.fillRect(ix, iy, 1, 1);
        ctx.fillStyle = core;
        ctx.fillRect(ix, iy, 1, 1);
    } else if (kind === 1) {
        ctx.fillStyle = halo;
        ctx.fillRect(ix - 1, iy, 3, 1);
        ctx.fillRect(ix, iy - 1, 1, 3);
        ctx.fillStyle = core;
        ctx.fillRect(ix, iy, 1, 1);
        if (Math.random() > 0.4) ctx.fillRect(ix - 1, iy, 1, 1);
        if (Math.random() > 0.4) ctx.fillRect(ix + 1, iy, 1, 1);
    } else if (kind === 2) {
        ctx.fillStyle = halo;
        ctx.fillRect(ix, iy, 2, 2);
        ctx.fillStyle = core;
        ctx.fillRect(ix, iy, 1, 1);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(ix + 1, iy, 1, 1);
        ctx.fillRect(ix, iy + 1, 1, 1);
    } else {
        ctx.fillStyle = halo;
        ctx.fillRect(ix - 1, iy - 1, 1, 1);
        ctx.fillRect(ix + 1, iy + 1, 1, 1);
        ctx.fillStyle = core;
        ctx.fillRect(ix, iy, 1, 1);
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(ix, iy, 1, 1);
        ctx.fillRect(ix - 1, iy + 1, 1, 1);
        ctx.fillRect(ix + 1, iy - 1, 1, 1);
    }
    ctx.imageSmoothingEnabled = true;
}

function makeSpiceSparkPoints(cx, cy, radius, count) {
    const pts = [];
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * (radius - 8) * 0.92;
        pts.push({
            x: cx + Math.cos(angle) * dist,
            y: cy + Math.sin(angle) * dist,
            kind: Math.floor(Math.random() * 4),
        });
    }
    return pts;
}

function triggerSpiceTwinkle(count) {
    if (!planetRenderState) return;
    const { cx, cy, radius } = planetRenderState;
    planetActiveSparks = makeSpiceSparkPoints(cx, cy, radius, count);
    planetSparkUntil = performance.now() + PLANET_SPARK_MS;
}

function startPlanetFlashes() {
    if (planetFlashTimer) clearInterval(planetFlashTimer);
    if (planetSparkTimer) clearInterval(planetSparkTimer);
    if (!planetRenderState) return;

    const twinkle = () => triggerSpiceTwinkle(8 + Math.floor(Math.random() * 12));

    twinkle();
    planetFlashTimer = setInterval(twinkle, PLANET_SPARK_INTERVAL);
    planetSparkTimer = setInterval(() => {
        if (Math.random() > 0.55) return;
        triggerSpiceTwinkle(1 + Math.floor(Math.random() * 2));
    }, 1100);
}

function drawPlanet() {
    const wrap = document.getElementById('planet-wrap');
    wrap.innerHTML = '';
    const img = new Image();
    img.src = SHIP_IMG.planet;

    const build = () => {
        const imgW = PLANET_DISPLAY_W;
        const imgH = Math.round(imgW * (img.naturalHeight / img.naturalWidth));
        const size = Math.max(imgW, imgH);
        const dpr = getPlanetDpr();
        const cx = size / 2;
        const cy = size / 2;
        const r = Math.min(imgW, imgH) / 2;

        wrap.style.width = size + 'px';
        wrap.style.height = size + 'px';

        const cvs = document.createElement('canvas');
        cvs.width = Math.round(size * dpr);
        cvs.height = Math.round(size * dpr);
        cvs.style.width = size + 'px';
        cvs.style.height = size + 'px';
        cvs.className = 'planet-canvas';
        const ctx = cvs.getContext('2d');
        ctx.imageSmoothingEnabled = true;
        ctx.imageSmoothingQuality = 'high';

        wrap.appendChild(cvs);

        planetRenderState = {
            ctx,
            cx,
            cy,
            radius: r,
            size,
            img,
            imgW,
            imgH,
            dpr,
            displayW: size,
            displayH: size,
        };
        planetSpinAngle = 0;
        paintPlanetSurface();
        startPlanetSpin();
        startPlanetFlashes();
    };

    if (img.complete && img.naturalWidth) build();
    else img.onload = build;
}

function renderPlayerShip() {
    const el = $('player-ship');
    el.innerHTML = '';
    const flame = document.createElement('canvas');
    flame.className = 'ship-flame';
    flame.width = 5;
    flame.height = 10;
    el.appendChild(flame);

    const ship = getCurrentShip();
    const miningSrc = getShipMiningSrc(ship);
    if (miningSrc) {

        img.draggable = false;
        el.appendChild(img);
    } else {
        el.appendChild(renderShipGraphic(ship, state.factionId, 3));
    }
    updateShipVisual();
}

function fillStars(container, count) {
    if (container.dataset.done) return;
    container.dataset.done = '1';

        const s = document.createElement('div');

        s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${Math.random()*2+1}px;height:${Math.random()*2+1}px;--d:${1.5+Math.random()*3}s;--delay:${Math.random()*2}s`;
        container.appendChild(s);
    }
}

function updateHUD() {

    setTimeout(() => el.remove(), 2500);

    el.className = 'mine-loot';

function flyToPlanetDock() {
    if (returningToPlanet || shipFlying) return;
    if (DEV_FREE_FUEL || state.resources.fuel >= FUEL_PER_FLIGHT) return;
    returningToPlanet = true;
    shipFlying = true;
    const dock = getShipHome();
    flyShipTo(dock.x, dock.y, () => {
        returningToPlanet = false;
        shipFlying = false;
        showMineLoot('⛽ Нет топлива', MAP_CENTER.x, MAP_CENTER.y + 60);
    });
}

function checkFuelAndReturn() {
    if (!DEV_FREE_FUEL && state.resources.fuel < FUEL_PER_FLIGHT) {
        flyToPlanetDock();
    }
}

function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));

    if (tab === 'mining') {
        $('mining-screen').classList.add('active');
        hideOverlay();
        syncPanelHeights();
        applyGameInsets();
        requestAnimationFrame(() => {
            syncPanelHeights();
            refreshWorldBounds();
            layoutMining();
            renderPlayerShip();
            requestAnimationFrame(() => {
                syncPanelHeights();
                onMiningResize();
                resetShipToOrbit();
            });
        });
    } else {
        stopPlanetSpin();
        $('mining-screen').classList.remove('active');
        $('overlay').classList.add('active');
        if (tab === 'hangar') { showWindow('hangar'); renderHangar(); }
        if (tab === 'pvp')     { showWindow('pvp'); renderPvP(); }
        if (tab === 'minigames') showWindow('minigames');
    }
}

// ─── Добыча ──────────────────────────────────────────────────
function drawMeteorSprite(ctx, ps) {
    for (let y = 0; y < 14; y++) for (let x = 0; x < 14; x++) {
        const dx = x - 6.5, dy = y - 7;
        if (dx * dx + dy * dy > 30) continue;
        const c = ((x + y) % 5);
        ctx.fillStyle = ['#4a3020', '#6a4830', '#8a6850', '#5a3828', '#3a2018'][c];
        ctx.fillRect(x * ps, y * ps, ps, ps);
    }
    ctx.fillStyle = '#2a1810';
    ctx.fillRect(4 * ps, 5 * ps, 2 * ps, ps);
    ctx.fillRect(8 * ps, 8 * ps, 2 * ps, ps);
    ctx.fillRect(5 * ps, 9 * ps, ps, ps);
}

function drawWreckSprite(ctx, ps) {
    const plate = (x, y, w, h, col) => {
        ctx.fillStyle = col;
        ctx.fillRect(x * ps, y * ps, w * ps, h * ps);
    };
    plate(2, 6, 10, 2, '#3a4050');
    plate(4, 4, 6, 2, '#5a6070');
    plate(1, 8, 4, 2, '#aa5533');
    plate(9, 7, 3, 3, '#6a7078');
    plate(6, 9, 5, 1, '#404850');
    plate(3, 2, 2, 3, '#cc6633');
    plate(10, 3, 2, 2, '#888890');
    ctx.fillStyle = '#40e8ff';
    ctx.fillRect(5 * ps, 5 * ps, ps, ps);
}

function drawPirateSprite(ctx, ps) {
    const px = (x, y, c) => { ctx.fillStyle = c; ctx.fillRect(x * ps, y * ps, ps, ps); };
    const body = '#aa2222', dark = '#661010', wing = '#882828', cockpit = '#ffcc44';
    for (let y = 2; y < 14; y++) px(6, y, body);
    for (let x = 2; x < 11; x++) { px(x, 4, wing); px(x, 9, wing); }
    px(5, 1, dark); px(6, 1, dark); px(7, 1, dark);
    px(6, 3, cockpit);
    px(4, 6, dark); px(8, 6, dark);
    px(5, 12, dark); px(7, 12, dark);
    px(6, 13, '#ff4444');
}

function createMineSprite(kind) {
    const ps = kind === 'meteor' ? 6 : 2;
    const size = { meteor: [14, 14], wreck: [14, 12], pirate: [12, 14] }[kind];
    const cvs = document.createElement('canvas');
    cvs.width = size[0] * ps;
    cvs.height = size[1] * ps;
    const ctx = cvs.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    if (kind === 'meteor') drawMeteorSprite(ctx, ps);
    else if (kind === 'wreck') drawWreckSprite(ctx, ps);
    else drawPirateSprite(ctx, ps);
    return cvs;
}

function initMiningWorld() {
    refreshWorldBounds();
    const world = $('mining-world');
    world.style.width = worldBounds.width + 'px';
    world.style.height = worldBounds.height + 'px';
    const hub = $('mining-hub');
    hub.style.left = MAP_CENTER.x + 'px';
    hub.style.top = MAP_CENTER.y + 'px';
    const laser = $('laser-layer');
    laser.setAttribute('width', worldBounds.width);
    laser.setAttribute('height', worldBounds.height);
    laser.setAttribute('viewBox', `0 0 ${worldBounds.width} ${worldBounds.height}`);
    world.appendChild(laser);
    if (!world.dataset.planet) {
        drawPlanet();
        world.dataset.planet = '1';
    }
}

function getShipOrbit() {
    return { x: MAP_CENTER.x, y: MAP_CENTER.y + ORBIT_DIST, rot: 0 };
}

function resetShipToOrbit() {
    refreshWorldBounds();
    const o = getShipOrbit();
    shipPos = clampWorld(o.x, o.y);
    shipRotation = o.rot;
    shipTarget = null;
    updateShipVisual();
}

function getShipHome() {
    return getShipOrbit();
}

function getMineStopDist(kind) {
    return kind === 'meteor' ? MINE_STOP_DIST_METEOR : MINE_STOP_DIST;
}

function clampWorld(x, y, margin = 28) {
    return {
        x: Math.max(margin, Math.min(worldBounds.width - margin, x)),
        y: Math.max(margin, Math.min(worldBounds.height - margin, y)),
    };
}

function setShipPos(x, y, rot = shipRotation) {
    shipPos = clampWorld(x, y);
    shipRotation = rot;
    updateShipVisual();
}

function moveShip(wx, wy) {
    if (shipFlying) return;
    const p = clampWorld(wx, wy);
    flyShipTo(p.x, p.y);
}

function layoutMining() {
    initMiningWorld();
    resetShipToOrbit();
    if (!mineObjects.length) generateMineObjects();
}

function onMiningResize() {
    if (currentTab !== 'mining') return;
    syncPanelHeights();
    applyGameInsets();
    const prevCenter = { x: MAP_CENTER.x, y: MAP_CENTER.y };
    refreshWorldBounds();
    const world = $('mining-world');
    if (world) {
        world.style.width = worldBounds.width + 'px';
        world.style.height = worldBounds.height + 'px';
        $('mining-hub').style.left = MAP_CENTER.x + 'px';
        $('mining-hub').style.top = MAP_CENTER.y + 'px';
        const laser = $('laser-layer');
        if (laser) {
            laser.setAttribute('width', worldBounds.width);
            laser.setAttribute('height', worldBounds.height);
            laser.setAttribute('viewBox', `0 0 ${worldBounds.width} ${worldBounds.height}`);
            world.appendChild(laser);
        }
    }
    if (Math.abs(prevCenter.x - MAP_CENTER.x) > 1 || Math.abs(prevCenter.y - MAP_CENTER.y) > 1) {
        generateMineObjects();
    }
    resetShipToOrbit();
}

function shuffleArr(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

function bindMineObject(obj) {
    const el = obj.el;
    let touchHandled = false;

    el.addEventListener('touchstart', e => e.stopPropagation(), { passive: true });

    el.addEventListener('touchend', e => {
        e.stopPropagation();
        e.preventDefault();
        touchHandled = true;
        setTimeout(() => { touchHandled = false; }, 450);
        if (!state.profileComplete || shipFlying) return;
        flyToMine(obj);
    }, { passive: false });

    el.addEventListener('click', e => {
        e.stopPropagation();
        if (touchHandled) return;
        if (!state.profileComplete || shipFlying) return;
        flyToMine(obj);
    });
}

function buildMineKinds() {
    // 9 объектов: по 3 каждого типа, порядок случайный
    return shuffleArr([
        ...Array(3).fill('meteor'),
        ...Array(3).fill('wreck'),
        ...Array(3).fill('pirate'),
    ]);
}

function generateMineObjects() {
    const world = $('mining-world');
    if (!world) return;
    world.querySelectorAll('.mine-object').forEach(e => e.remove());
    mineObjects = [];
    refreshWorldBounds();

    const kinds = buildMineKinds();
    const placed = [];
    const cx = MAP_CENTER.x, cy = MAP_CENTER.y;
    const PLANET_R = PLANET_HUB_R;
    const MIN_FROM_PLANET = PLANET_R + 90;
    const MAX_FROM_PLANET = Math.min(worldBounds.width, worldBounds.height) / 2 - 55;
    const MIN_FROM_OBJ = 75;
    const margin = 40;

    kinds.forEach(kind => {
        let x, y, ok = false;
        for (let attempt = 0; attempt < 500 && !ok; attempt++) {
            const angle = Math.random() * Math.PI * 2;
            const dist = MIN_FROM_PLANET + Math.random() * (MAX_FROM_PLANET - MIN_FROM_PLANET);
            x = cx + Math.cos(angle) * dist;
            y = cy + Math.sin(angle) * dist;
            x = Math.max(margin, Math.min(worldBounds.width - margin, x));
            y = Math.max(margin, Math.min(worldBounds.height - margin, y));
            if (Math.hypot(x - cx, y - cy) < MIN_FROM_PLANET) continue;
            if (placed.some(p => Math.hypot(x - p.x, y - p.y) < MIN_FROM_OBJ)) continue;
            ok = true;
        }
        if (!ok) {
            const angle = (placed.length / kinds.length) * Math.PI * 2 + Math.random() * 0.5;
            const dist = MIN_FROM_PLANET + Math.random() * (MAX_FROM_PLANET - MIN_FROM_PLANET) * 0.7;
            x = cx + Math.cos(angle) * dist;
            y = cy + Math.sin(angle) * dist;
            const p = clampWorld(x, y, margin);
            x = p.x;
            y = p.y;
        }
        placed.push({ x, y });

        const el = document.createElement('div');
        el.className = 'mine-object mine-' + kind;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.appendChild(createMineSprite(kind));

        mineObjects.push({ x, y, kind, el });
        bindMineObject(mineObjects[mineObjects.length - 1]);
        world.insertBefore(el, $('player-ship'));
    });

    // Эффекты поверх объектов
    const laser = $('laser-layer');
    if (laser) world.appendChild(laser);
}

function rollLootForKind(kind) {
    const r = state.resources;
    if (kind === 'meteor') {
        const credits = 15 + Math.floor(Math.random() * 35);
        const shards = 1 + Math.floor(Math.random() * 2);
        r.credits += credits;
        r.shards += shards;
        return `Метеорит: +${credits} 🪙 +${shards} 🧩`;
    }
    if (kind === 'wreck') {
        const fuel = 4 + Math.floor(Math.random() * 8);
        r.fuel = Math.min(state.maxFuel, r.fuel + fuel);
        r.weaponParts++;
        return `Обломки: +${fuel} ⛽ +1 ⚔️`;
    }
    const spice = 1 + Math.floor(Math.random() * 3);
    const credits = 20 + Math.floor(Math.random() * 30);
    r.spice += spice;
    r.credits += credits;
    return `Пират: +${spice} 💎 +${credits} 🪙`;
}

function fireLasersAt(obj, onDone, color = 'blue') {
    const layer = $('laser-layer');
    layer.innerHTML = '';
    const nose = getShipNose();
    const offsets = [-4, 0, 4];
    const cls = color === 'red' ? 'laser-beam laser-red' : 'laser-beam laser-blue';

    offsets.forEach(off => {
        const rad = (shipRotation - 90) * Math.PI / 180;
        const px = nose.x + Math.cos(rad + Math.PI / 2) * off;
        const py = nose.y + Math.sin(rad + Math.PI / 2) * off;
        const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        line.setAttribute('class', cls);
        line.setAttribute('x1', px);
        line.setAttribute('y1', py);
        line.setAttribute('x2', obj.x);
        line.setAttribute('y2', obj.y);
        layer.appendChild(line);
    });

    setTimeout(() => {
        layer.innerHTML = '';
        onDone();
    }, MINE_LASER_MS);
}

function fireSoundWavesAt(obj, onDone) {
    const layer = $('laser-layer');
    layer.innerHTML = '';
    const nose = getShipNose();
    const dx = obj.x - nose.x, dy = obj.y - nose.y;
    const dist = Math.max(1, Math.hypot(dx, dy));
    const nx = dx / dist, ny = dy / dist;
    const px = -ny, py = nx;

    for (let i = 0; i < 5; i++) {
        const t = 0.12 + (i + 1) * 0.14;
        const mx = nose.x + dx * t;
        const my = nose.y + dy * t;
        const bulge = 10 + i * 7;
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        const x1 = mx - px * bulge, y1 = my - py * bulge;
        const x2 = mx + px * bulge, y2 = my + py * bulge;
        const cx = mx + nx * 8, cy = my + ny * 8;
        path.setAttribute('d', `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`);
        path.setAttribute('class', 'sound-wave');
        path.style.animationDelay = `${i * 0.18}s`;
        layer.appendChild(path);
    }

    setTimeout(() => {
        layer.innerHTML = '';
        onDone();
    }, MINE_LASER_MS);
}

function fireMineEffect(obj, onDone) {
    if (obj.kind === 'meteor') fireSoundWavesAt(obj, onDone);
    else if (obj.kind === 'wreck') fireLasersAt(obj, onDone, 'blue');
    else fireLasersAt(obj, onDone, 'red');
}

function flyToMine(obj) {
    if (shipFlying || returningToPlanet) return;
    if (!mineObjects.includes(obj)) return;
    if (!DEV_FREE_FUEL && state.resources.fuel < FUEL_PER_FLIGHT) {
        flyToPlanetDock();
        return;
    }

    shipFlying = true;
    if (!DEV_FREE_FUEL) {
        state.resources.fuel -= FUEL_PER_FLIGHT;
        Storage.save();
        updateHUD();
    }

    const lootX = obj.x, lootY = obj.y;
    const target = approachPoint(obj.x, obj.y, getMineStopDist(obj.kind));
    flyShipTo(target.x, target.y, () => {
        fireMineEffect(obj, () => {
            const loot = rollLootForKind(obj.kind);
            showMineLoot(loot, lootX, lootY);
            state.exp += 12;
            if (state.exp >= state.level * 100) {
                state.exp -= state.level * 100;
                state.level++;
                showMineLoot(`Уровень ${state.level}!`, lootX, lootY - 18);
            }
            obj.el.style.opacity = '0';
            mineObjects = mineObjects.filter(o => o !== obj);
            setTimeout(() => {
                obj.el.remove();
                shipFlying = false;
                if (mineObjects.length === 0) generateMineObjects();
                Storage.save();
                updateHUD();
                checkFuelAndReturn();
            }, 300);
        });
    });
}

function initMiningTap() {
    const vp = $('mining-viewport');
    if (vp.dataset.ready) return;
    vp.dataset.ready = '1';
    let lastTouch = 0;
    let touchStart = null;

    const onMoveTap = (cx, cy) => {
        if (!state.profileComplete || shipFlying) return;
        const w = screenToWorld(cx, cy);
        moveShip(w.x, w.y);
    };

    vp.addEventListener('touchstart', e => {
        if (e.target.closest('.mine-object')) return;
        const t = e.changedTouches[0] || e.touches[0];
        if (!t) return;
        touchStart = { x: t.clientX, y: t.clientY, time: Date.now() };
    }, { passive: true });

    vp.addEventListener('touchend', e => {
        if (e.target.closest('.mine-object')) return;
        const t = e.changedTouches[0];
        if (!t || !touchStart) return;
        if (Date.now() - touchStart.time > 600) { touchStart = null; return; }
        const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
        if (Math.hypot(dx, dy) > 22) { touchStart = null; return; }
        e.preventDefault();
        lastTouch = Date.now();
        onMoveTap(touchStart.x, touchStart.y);
        touchStart = null;
    }, { passive: false });

    vp.addEventListener('touchcancel', () => { touchStart = null; });

    vp.addEventListener('click', e => {
        if (e.target.closest('.mine-object')) return;
        if (Date.now() - lastTouch < 450) return;
        onMoveTap(e.clientX, e.clientY);
    });
}

// ─── Ангар ───────────────────────────────────────────────────
function upgradeCost(key) {
    const lvl = state.upgrades[key];
    if (key === 'fuelTank') return { credits: 100 * 2**lvl, parts: 0 };
    return { credits: 50 * 2**lvl, parts: Math.ceil(5 * 1.5**lvl) };
}

function renderHangar() {
    const r = state.resources;
    $('hangar-ship').innerHTML = '';
    $('hangar-ship').appendChild(drawCurrentShip(5));
    $('hangar-res').textContent = `🪙${Math.floor(r.credits)} ⛽${Math.floor(r.fuel)}/${state.maxFuel} 🛡️${r.shieldParts} ⚔️${r.weaponParts} 💎${r.spice} 🧩${r.shards}`;

    $('upgrade-list').innerHTML = UPGRADES.map(u => {
        const lvl = state.upgrades[u.key];
        const cost = upgradeCost(u.key);
        const can = lvl < u.max && r.credits >= cost.credits;
        return `<div class="upgrade-row"><span>${u.label} ${lvl}/${u.max}</span><button class="btn btn-sm" ${can?'':'disabled'} data-upg="${u.key}">${cost.credits}🪙</button></div>`;
    }).join('');

    $('upgrade-list').querySelectorAll('[data-upg]').forEach(btn => {
        btn.onclick = () => {
            const key = btn.dataset.upg;
            const u = UPGRADES.find(x => x.key === key);
            const cost = upgradeCost(key);
            if (state.upgrades[key] >= u.max || state.resources.credits < cost.credits) return;
            state.resources.credits -= cost.credits;
            state.upgrades[key]++;
            if (key === 'fuelTank') { state.maxFuel += 10; state.resources.fuel = Math.min(state.maxFuel, state.resources.fuel + 10); }
            Storage.save(); updateHUD(); renderHangar();
        };
    });

    $('artifact-list').innerHTML = ARTIFACTS.map(a => {
        const eq = state.artifact.id === a.id;
        return `<div class="card ${eq?'selected':''}" data-art="${a.id}"><div>${a.name}</div><div style="font-size:3px;margin-top:3px">${eq?'ур.'+state.artifact.level:'нет'}</div></div>`;
    }).join('');
}

// ─── PvP (упрощённый) ───────────────────────────────────────
function renderPvP() {
    $('pvp-my-ship').innerHTML = ''; $('pvp-en-ship').innerHTML = '';
    $('pvp-my-ship').appendChild(drawCurrentShip(3));
    const en = document.createElement('span'); en.textContent = '👾'; en.style.fontSize='22px';
    $('pvp-en-ship').appendChild(en);
    $('pvp-my-bars').innerHTML = '<div class="bar"><div class="bar-fill bar-shield" style="width:100%"></div></div><div class="bar"><div class="bar-fill bar-hp" style="width:100%"></div></div>';
    $('pvp-en-bars').innerHTML = '<div class="bar"><div class="bar-fill bar-shield" style="width:100%"></div></div><div class="bar"><div class="bar-fill bar-hp" style="width:100%"></div></div>';
    $('leaderboard').innerHTML = '<div style="color:var(--gold)">ТОП 10</div>' +
        state.leaderboard.slice(0,10).map((p,i)=>`<div>#${i+1} ${p.name}: ${p.score}</div>`).join('');
}

function startPvP() {
    const result = Math.random() > 0.45 ? 'win' : 'lose';
    if (result === 'win') { state.pvpScore += 15; $('pvp-status').textContent = 'ПОБЕДА! +15'; showLoot('+15 PvP'); }
    else { state.pvpScore = Math.max(0, state.pvpScore - 10); $('pvp-status').textContent = 'ПОРАЖЕНИЕ... -10'; }
    const idx = state.leaderboard.findIndex(p => p.name === state.playerName);
    if (idx >= 0) state.leaderboard[idx].score = state.pvpScore;
    else state.leaderboard.push({ name: state.playerName, score: state.pvpScore });
    state.leaderboard.sort((a,b) => b.score - a.score);
    Storage.save(); renderPvP();
}

// ─── Онбординг ───────────────────────────────────────────────
function renderFactions() {
    $('faction-list').innerHTML = FACTIONS.map(f =>
        `<button class="btn" style="border-color:${f.color};color:${f.color}" data-fid="${f.id}">
            ◆ ${f.name}<br><small style="font-size:4px">Щ:${f.shield} У:${f.damage} С:${f.speed}</small>
        </button>`
    ).join('');
    $('faction-list').querySelectorAll('[data-fid]').forEach(btn => {
        btn.onclick = () => {
            state.factionId = btn.dataset.fid;
            state.shipIndex = 0;
            Storage.save();
            renderShips();
            showWindow('ship');
        };
    });
}

function renderShips() {
    const ships = getShipList();
    const faction = FACTIONS.find(f => f.id === state.factionId);

    $('ship-list').innerHTML = ships.map((ship, i) =>
        `<div class="card ${(state.shipIndex ?? -1) === i ? 'selected' : ''}" data-ship="${i}">
            <div class="ship-name">${ship.name}</div>
            <div class="ship-desc">${ship.desc}</div>
            <div class="ship-preview" data-preview="${i}"></div>
        </div>`
    ).join('');

    $('ship-list').querySelectorAll('[data-ship]').forEach(card => {
        const i = +card.dataset.ship;
        card.querySelector('[data-preview]').appendChild(
            renderShipGraphic(ships[i], state.factionId, 6)
        );
        if (faction) card.style.borderColor = (state.shipIndex ?? -1) === i ? '#ffaa00' : faction.color;
        card.onclick = () => {
            state.shipIndex = i;
            Storage.save();
            renderShips();
            $('btn-ship-confirm').disabled = false;
        };
    });

    if (state.shipIndex !== null && state.shipIndex !== undefined) {
        $('btn-ship-confirm').disabled = false;
    } else {
        $('btn-ship-confirm').disabled = true;
    }
}

function completeProfile() {
    state.profileComplete = true;
    Storage.save();
    showGameUI();
    switchTab('mining');
}

function resumeOrStart() {
    if (state.profileComplete) {
        showGameUI();
        switchTab('mining');
        updateHUD();
        return;
    }
    $('inp-name').value = state.playerName || '';
    $('start-hint')?.classList.add('hidden');
    showWindow('start');
}

async function resetGame() {
    state = defaultState();
    state.profileComplete = false;

    shipPos = { x: 0, y: 0 };
    shipRotation = 0;
    shipTarget = null;
    camera = { x: 0, y: 0 };
    if (shipAnimFrame) cancelAnimationFrame(shipAnimFrame);
    shipAnimFrame = null;
    shipFlying = false;
    returningToPlanet = false;
    mineObjects = [];
    if (window._neonFlickerTimer) { clearInterval(window._neonFlickerTimer); window._neonFlickerTimer = null; }
    if (planetFlashTimer) { clearInterval(planetFlashTimer); planetFlashTimer = null; }
    if (planetSparkTimer) { clearInterval(planetSparkTimer); planetSparkTimer = null; }
    stopPlanetSpin();
    planetRenderState = null;
    planetActiveSparks = [];
    planetSparkUntil = 0;
    $('mining-world')?.querySelectorAll('.mine-object, .mine-loot').forEach(el => el.remove());
    delete $('mining-world')?.dataset.planet;

    await Storage.saveAsync();

    $('mining-screen').classList.remove('active');
    $('top-panel').classList.add('hidden');
    $('bottom-nav').classList.add('hidden');
    $('btn-ship-confirm').disabled = true;
    $('inp-name').value = '';
    $('start-hint')?.classList.add('hidden');
    showWindow('start');
    updateHUD();
}

// ─── Инициализация ───────────────────────────────────────────
function bindEvents() {
    $('btn-start').onclick = () => {
        const name = $('inp-name').value.trim();
        const hint = $('start-hint');
        if (name.length < 2) {
            hint.textContent = 'Минимум 2 символа';
            hint.classList.remove('hidden');
            return;
        }
        hint.classList.add('hidden');
        state.playerName = name;
        Storage.save();
        renderFactions();
        showWindow('faction');
    };

    $('btn-ship-confirm').onclick = completeProfile;

    $('btn-reset').onclick = async () => {
        if (!confirm('Сбросить прогресс и выбрать фракцию заново?')) return;
        await resetGame();
    };

    document.querySelectorAll('[data-tab]').forEach(btn => {
        btn.onclick = () => switchTab(btn.dataset.tab);
    });

    document.querySelectorAll('[data-open]').forEach(btn => {
        btn.onclick = () => showWindow(btn.dataset.open);
    });

    $('btn-pvp').onclick = startPvP;
    $('btn-checkin').onclick = () => {
        if (state.checkin.claimedToday) return alert('Уже забрали сегодня');
        state.resources.credits += 20; state.resources.fuel = Math.min(state.maxFuel, state.resources.fuel + 5);
        state.checkin.claimedToday = true; state.checkin.day = Math.min(7, state.checkin.day + 1);
        Storage.save(); updateHUD(); showLoot('+20 🪙 +5 ⛽');
    };

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') Storage.save();
        if (document.visibilityState === 'visible') {
            applyGameInsets();
            syncPanelHeights();
            onMiningResize();
        }
    });
    window.addEventListener('pagehide', () => Storage.save());
    const relayout = () => {
        syncPanelHeights();
        applyGameInsets();
        onMiningResize();
    };
    window.addEventListener('resize', relayout);
    window.addEventListener('orientationchange', () => setTimeout(relayout, 150));
    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', relayout);
        window.visualViewport.addEventListener('scroll', relayout);
    }
    if (typeof ResizeObserver !== 'undefined') {
        const ro = new ResizeObserver(() => relayout());
        const top = $('top-panel');
        const nav = document.querySelector('.bottom-nav');
        const mvp = $('mining-viewport');
        if (top) ro.observe(top);
        if (nav) ro.observe(nav);
        if (mvp) ro.observe(mvp);
    }
}

async function boot() {
    initTelegram();
    applyGameInsets();
    syncPanelHeights();
    fillStars($('stars-global'), 380);
    initMiningTap();
    await Storage.load();
    bindEvents();
    resumeOrStart();
    updateHUD();

    // Восстановление топлива
    setInterval(() => {
        if (state.resources.fuel < state.maxFuel) {
            state.resources.fuel = Math.min(state.maxFuel, state.resources.fuel + 1);
            updateHUD();
            Storage.save();
        }
    }, 4 * 60 * 1000);
}

document.addEventListener('DOMContentLoaded', boot);
</script>
